<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Money Tiles</title>
<style>
@font-face{font-family:Nunito;src:url(nunito.woff2) format('woff2');font-weight:400 800;font-display:swap}
:root{
  --rg:#B76E79; --rg2:#D9A59A; --rg3:#F3D9D2; --blush:#FBEDEA; --bg:#FFF8F6; --gold:#E2B27A;
  --ink:#4A3036; --mut:#9B7F84; --line:#F1DEDA; --green:#2E9D5B; --red:#D9434E;
  --grad:linear-gradient(135deg,#EDC2B4 0%,#DDA69A 45%,#C08085 80%,#B76E79 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:15px;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.ic{width:24px;height:24px;fill:currentColor;flex:none}
.green{color:var(--green)} .red{color:var(--red)} .mut{color:var(--mut)} .rg{color:var(--rg)}
.hidden{display:none!important}

/* splash */
#splash{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s}
#splash .logo{width:112px;height:112px;border-radius:34px;background:#FBE3DF;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(183,110,121,.25)}
#splash .name{position:absolute;bottom:46px;font-size:22px;font-weight:800;color:var(--rg)}

/* header */
.hero{background:var(--grad);color:#fff;padding:14px 12px 58px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;top:-40px;right:-30px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,0) 70%)}
.hrow{display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.hrow .hlogo{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(120,60,70,.18)}
.hrow h1{flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.ib{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ib:active{background:rgba(255,255,255,.25)}
.month{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:10px;position:relative;z-index:1}
.month b{min-width:150px;text-align:center;font-size:17px;font-weight:800}
.month .ib{width:38px;height:38px;background:rgba(255,255,255,.18)}

/* totals */
.totals{margin:-44px 12px 0;position:relative;z-index:2;background:#fff;border-radius:22px;padding:14px 10px 12px;box-shadow:0 8px 24px rgba(183,110,121,.18);border:1px solid var(--line)}
.totals h3{margin:0 6px 10px;font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tg{background:var(--blush);border-radius:14px;padding:10px 6px;text-align:center;min-width:0}
.tg small{display:block;font-size:12px;font-weight:700;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg b{display:block;font-size:16px;font-weight:800;margin-top:3px;white-space:nowrap}
.tg i{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:1px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 12px 40px}
.tile{position:relative;background:linear-gradient(165deg,#FFFFFF 0%,#FCEDEA 100%);border:1px solid var(--line);border-radius:24px;padding:14px;min-height:168px;text-align:left;display:flex;flex-direction:column;box-shadow:0 6px 16px rgba(183,110,121,.10);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ti{width:60px;height:60px;border-radius:19px;background:#FBE3DF;display:flex;align-items:center;justify-content:center}
.tile .tn{font-weight:800;font-size:16px;margin-top:10px}
.tile .tt{font-weight:800;font-size:21px;margin-top:auto;padding-top:6px}
.tile .ts{font-size:12.5px;color:var(--mut);font-weight:600}
.tile .pb{margin-top:6px}
.tile.add{border:2px dashed var(--rg2);background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--rg);font-weight:800;gap:8px}
.tile.add .plus{width:52px;height:52px;border-radius:50%;background:var(--blush);display:flex;align-items:center;justify-content:center}
.pb{height:7px;border-radius:4px;background:var(--rg3);overflow:hidden}
.pb i{display:block;height:100%;border-radius:4px;background:var(--green)}

/* sheets */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .24s ease}
.sheet.in{transform:none}
.sh{flex:none;background:var(--grad);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 6px;min-height:58px}
.sh h2{flex:1;margin:0;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh h2 .mini{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;flex:none}
.sb{flex:1;overflow-y:auto;padding-bottom:110px}
.pop{position:fixed;inset:0;background:rgba(74,48,54,.35);z-index:40;display:flex;align-items:flex-end;opacity:0;transition:opacity .18s}
.pop.in{opacity:1}
.pc{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:10px 0 20px;max-height:86%;overflow:auto;transform:translateY(30px);transition:transform .18s}
.pop.in .pc{transform:none}
.pop.dlg{align-items:center;justify-content:center;padding:24px}
.pop.dlg .pc{border-radius:22px;padding:20px 20px 10px;max-width:360px}
.pc h3{margin:6px 18px 10px;font-size:17px;font-weight:800}
.pop.dlg .pc h3{margin:0 0 8px}
.pc p{margin:0 0 14px;line-height:1.5;color:#6d555a;font-size:14.5px}
.dlgb{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.dlgb button{padding:10px 14px;color:var(--rg);font-weight:800;border-radius:10px}
.dlgb button.danger{color:var(--red)}
.opt{display:flex;align-items:center;gap:14px;padding:14px 20px;font-size:16px;width:100%;text-align:left;font-weight:600}
.opt:active{background:var(--blush)}
.opt.danger{color:var(--red)}

/* tile page */
.big{margin:14px 12px 0;background:#fff;border-radius:22px;padding:16px;border:1px solid var(--line);box-shadow:0 6px 18px rgba(183,110,121,.10);text-align:center}
.big small{font-size:13px;font-weight:700;color:var(--mut)}
.big b{display:block;font-size:32px;font-weight:800;margin:2px 0}
.big .split{display:flex;justify-content:space-around;margin-top:8px;font-size:13.5px;font-weight:700}
.big .split span{display:flex;flex-direction:column}
.big .split em{font-style:normal;font-size:17px;font-weight:800}
.big .pb{margin-top:10px;height:9px}
.mbar{display:flex;align-items:center;justify-content:center;gap:4px;margin:12px 0 0;color:var(--rg)}
.mbar b{min-width:140px;text-align:center;font-weight:800;font-size:16px}
.mbar .ib{background:var(--blush)}
.seg{display:flex;background:var(--blush);border-radius:14px;padding:4px;margin:12px 12px 0}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:800;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px}
.seg button .ic{width:19px;height:19px}
.seg button.on{background:#fff;color:var(--rg);box-shadow:0 2px 6px rgba(183,110,121,.15)}
.list{margin:12px 12px 0;background:#fff;border-radius:20px;border:1px solid var(--line);overflow:hidden}
.dsep{padding:9px 16px 5px;font-size:12.5px;font-weight:800;color:var(--mut);background:#FFFBFA;border-top:1px solid var(--line)}
.dsep:first-child{border-top:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:62px;transition:background .15s}
.dsep + .row,.list > .row:first-child{border-top:0}
.row:active{background:var(--blush)}
.bub{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:20px}
.bub.in{background:#E3F4E9;color:var(--green)} .bub.out{background:#FBE3E5;color:var(--red)}
#fDir button.on[data-d=in]{color:var(--green)} #fDir button.on[data-d=out]{color:var(--red)}
.mid{flex:1;min-width:0}
.nm{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--mut);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:3px;background:var(--blush);color:var(--rg);border-radius:8px;padding:1px 7px;font-weight:700;font-size:11.5px}
.tag .ic{width:12px;height:12px}
.amt{font-weight:800;font-size:16px;white-space:nowrap}
.pen{color:var(--rg2);margin-left:-4px;display:flex}
.pen .ic{width:18px;height:18px}
.tag.due{background:#FDE2E4;color:var(--red)}
.ck{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--rg2);display:flex;align-items:center;justify-content:center;flex:none;color:transparent;transition:all .18s}
.ck .ic{width:20px;height:20px}
.ck.on{background:var(--green);border-color:var(--green);color:#fff;animation:popk .25s}
@keyframes popk{50%{transform:scale(1.2)}}
.row.done .nm,.row.done .amt{text-decoration:line-through;text-decoration-thickness:2px;opacity:.45}
.row.done .sub{opacity:.6}
.empty{padding:30px 22px;text-align:center;color:var(--mut);font-size:14.5px;line-height:1.5;font-weight:600}
.empty .ei{width:84px;height:84px;margin:0 auto 10px;opacity:.9}
.fab{position:fixed;right:18px;bottom:22px;width:62px;height:62px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(183,110,121,.45);z-index:31}
.fab .ic{width:32px;height:32px}
.fab:active{transform:scale(.94)}

/* calendar */
.cal{margin:12px 12px 0;background:#fff;border-radius:20px;border:1px solid var(--line);padding:10px 8px}
.cal .wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;font-weight:800;color:var(--mut);padding-bottom:6px}
.cal .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .d{min-height:50px;border-radius:12px;padding:4px 1px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:14px}
.cal .d.o{visibility:hidden}
.cal .d.has{background:var(--blush)}
.cal .d .n{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.cal .d.today .n{background:var(--rg);color:#fff;border-radius:50%}
.cal .d.sel{outline:2.5px solid var(--rg);outline-offset:-2px}
.cal .d small{font-size:9.5px;font-weight:800;line-height:1.1;max-width:100%;overflow:hidden}
.cal .dots{display:flex;gap:2px}
.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--rg2)}
.cal .dots i.ok{background:var(--green)}
.dayh{display:flex;align-items:center;justify-content:space-between;margin:14px 16px 0;font-weight:800}
.dayh button{color:var(--rg);font-weight:800;display:flex;align-items:center;gap:4px}
.dayh button .ic{width:18px;height:18px}

/* forms */
.form{padding:6px 16px}
.amtbox{display:flex;align-items:center;justify-content:center;gap:4px;margin:16px 0 6px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px}
.amtbox .sg{font-size:34px;font-weight:800}
.amtbox input{width:100%;max-width:230px;border:0;outline:none;font-size:38px;font-weight:800;background:transparent;text-align:left}
.fld{margin:14px 0}
.fld > label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);background:#fff;padding:12px 14px;font-size:16px;outline:none;border-radius:14px;font-weight:600}
.fld input:focus,.fld select:focus{border-color:var(--rg2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 14px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:14px;color:#7a5f64}
.chips button.on{background:var(--rg);border-color:var(--rg);color:#fff}
.inl{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:700}
.inl input{max-width:110px}
.summary{margin-top:10px;background:var(--blush);color:var(--rg);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700;line-height:1.4}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:18px;background:var(--grad);color:#fff;font-weight:800;font-size:16px;margin-top:16px;box-shadow:0 6px 14px rgba(183,110,121,.3)}
.btn.soft{background:var(--blush);color:var(--rg);box-shadow:none}
.btn.ghost{background:transparent;color:var(--red);border:1.5px solid #F2C3C6;box-shadow:none}
.hint{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.45;font-weight:600}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.icons button{aspect-ratio:1;border-radius:18px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.icons button.on{border-color:var(--rg);background:var(--blush)}
.icons svg{width:44px;height:44px}
.kinds{display:grid;gap:8px}
.kinds button{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left;font-weight:600;font-size:14px;color:var(--mut)}
.kinds button b{display:block;color:var(--ink);font-size:15.5px}
.kinds button.on{border-color:var(--rg);background:var(--blush)}
.kinds .sw{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;max-width:86%;text-align:center;pointer-events:none}
.toast.on{opacity:1}
.setrow{display:flex;align-items:center;gap:14px;padding:15px 16px;border-top:1px solid var(--line);font-weight:700;width:100%;text-align:left}
.setrow:first-child{border-top:0}
.setrow .ic{color:var(--rg)}
.brow{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-weight:600;font-size:14.5px}
.dsep + .brow{border-top:0}
.brow.tot{font-weight:800}
.brow.net{font-size:18px;font-weight:800;background:#F1FAF4}
details.more{margin-top:10px}
details.more summary{color:var(--rg);font-weight:800;padding:6px 0;cursor:pointer}
.ded{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 8px 10px 12px;margin-bottom:8px}
.ded .dtop{display:flex;align-items:center;gap:6px}
.ded .dn{flex:1;border:0!important;padding:6px 0!important;font-weight:800!important;background:transparent!important}
.ded .dx{width:36px;height:36px;color:var(--mut)}
.ded .dbot{display:flex;gap:6px}
.ded .dbot input{flex:0 0 74px;padding:9px 10px!important}
.ded .dbot select{flex:1;padding:9px 6px!important;font-size:14px!important;min-width:0}
.xrow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14.5px;font-weight:600}
.xrow b{font-weight:800;white-space:nowrap}
.xh{margin:12px 0 2px;font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.pw{padding:10px 0;border-top:1px solid var(--line)}
.pw:first-child{border-top:0}
.pwh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;font-size:14.5px}
.pwh span{font-weight:800;color:var(--rg)} .pwh em{font-style:normal;color:var(--green)}
.pgrid{padding:6px 12px 10px}
.pdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pday{border-radius:12px;background:var(--blush);padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;border:2px solid transparent}
.pday small{font-size:10.5px;font-weight:800;color:var(--mut)}
.pday .dn2{font-size:12px;font-weight:700;color:var(--mut)}
.pday b{font-size:16px;font-weight:800;color:var(--ink)}
.pday.wkd{background:#FCE4E1}
.pday.past{background:#F1ECEB}
.pday.past b{color:#7d6a6e}
.pday.today{border-color:var(--rg);background:#fff}
.pday.chg::after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.pday .ptoi{font-style:normal;font-size:9px;font-weight:800;color:var(--rg)}
.pnav{display:flex;justify-content:center;gap:8px;margin-top:10px}
.pnav button{display:flex;align-items:center;gap:2px;padding:7px 12px;border-radius:14px;background:var(--blush);color:var(--rg);font-weight:800;font-size:13.5px}
.pnav .ic{width:18px;height:18px}
.quick{padding:12px 16px}
.quick > div:first-child{display:flex;justify-content:space-between;font-size:15.5px}
.quick > div:first-child span{font-weight:800;color:var(--rg)}
.stepper{display:flex;align-items:center;justify-content:center;gap:12px}
.stepper button{width:52px;height:52px;border-radius:50%;background:var(--blush);color:var(--rg);font-size:28px;font-weight:800}
.stepper input{width:110px;text-align:center;font-size:36px;font-weight:800;border:0;border-bottom:2px solid var(--line);outline:none;background:transparent}
.stepper.sm{gap:6px}
.stepper.sm button{width:36px;height:36px;font-size:20px}
.stepper.sm input{width:56px;font-size:18px;padding:4px 0}
.force{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.force .fc{max-width:380px;width:100%;text-align:center}
.force .flogo{width:104px;height:104px;margin:0 auto 14px;border-radius:30px;background:#FBE3DF;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(183,110,121,.25)}
.force h2{margin:0 0 8px;font-size:24px;font-weight:800;color:var(--rg)}
.force p{color:#6d555a;line-height:1.5;margin:0 0 10px}
.force ul{text-align:left;color:#6d555a;margin:0 0 6px;padding-left:22px;line-height:1.5;font-size:14.5px}
.force .pb{margin-top:6px;height:9px}
.force .flater{margin-top:16px;color:var(--mut);font-weight:700;text-decoration:underline}
.mcal{padding:8px 8px 12px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 6px;color:var(--rg)}
.mhead b{font-size:16px;font-weight:800}
.mhead .ib{background:var(--blush)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr) 44px;gap:3px}
.mdw{text-align:center;font-size:11px;font-weight:800;color:var(--mut);padding-bottom:2px}
.mc{position:relative;border-radius:10px;padding:4px 0 5px;display:flex;flex-direction:column;align-items:center;min-height:46px;border:2px solid transparent}
.mc.p0{background:#FBEDEA} .mc.p1{background:#F6E1DC}
.mc .mn{font-size:10.5px;font-weight:700;color:var(--mut)}
.mc b{font-size:14.5px;font-weight:800;color:var(--ink)}
.mc.out{opacity:.4}
.mc.past b{color:#8a777b}
.mc.today{border-color:var(--rg);background:#fff}
.mc.chg::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.mc.pay{border-color:var(--green)}
.pin{position:absolute;top:-6px;left:-4px;width:17px;height:17px;border-radius:50%;background:var(--green);color:#fff;font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.mc .hl{font-style:normal;font-size:8.5px;font-weight:800;color:var(--rg)}
.mw{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;background:#fff;border:1px solid var(--line)}
.mw b{font-size:13.5px;font-weight:800} .mw small{font-size:9.5px;color:var(--mut);font-weight:700}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r2 = n => Math.round((+n || 0) * 100) / 100;
const sum = (a, f) => r2(a.reduce((t, x) => t + f(x), 0));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
const monthEnd = (y, m) => new Date(y, m + 1, 0).getDate();
function addMonths(s, n, day) {
  const d = pd(s), want = day || d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  t.setDate(Math.min(want, monthEnd(t.getFullYear(), t.getMonth())));
  return iso(t);
}
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MO = MON.map(m => m.slice(0, 3));

const dayH = s => { const d = pd(s); return `${DOW[d.getDay()]}, ${MO[d.getMonth()]} ${d.getDate()}`; };
const ord = n => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
function fmt(n) { return S.currency + Math.abs(r2(n)).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
const MINUS = '−';

// money-out tiles count spending as positive, so a negative total there means more came back than went out
const totUp = (t, v) => t.kind === 'out' ? v < 0 : v >= 0;

/* ---------- state ---------- */
const KEY = 'isavemoney_tiles_v2';
let S;
function fresh() {
  return {
    v: 2, currency: '$',

      {id: 'earn', name: 'Earnings', kind: 'in', icon: 'piggy'},
      {id: 'tx', name: 'Transactions', kind: 'out', icon: 'bag'},
      {id: 'budget', name: 'Budget', kind: 'check', icon: 'clip'},
      {id: 'pay', name: 'Paycheck', kind: 'pay', icon: 'calc', pay: defPay()}

}
// A private build carries window.SEED (her organised statements + pay setup). Merge it once; never overwrite her own entries.
function applySeed() {
  const d = window.SEED;
  if (!d || !Array.isArray(d.tiles) || !Array.isArray(d.items) || (S.seeded || []).includes(d.id)) return;
  for (const [tid, prefixes] of Object.entries(d.replace || {})) S.items = S.items.filter(i => !(i.tile === tid && prefixes.some(x => i.id.startsWith(x))));
  const have = new Set(S.items.map(i => i.id));
  for (const t of d.tiles) {
    const cur = tileOf(t.id);
    if (!cur) S.tiles.push(JSON.parse(JSON.stringify(t)));
    else if (t.kind === 'pay' && t.pay && cur.kind === 'pay' && (d.payReplace || !(cur.pay && cur.pay.v === 2 && cur.pay.rate))) {
      const old = cur.pay || {};
      cur.pay = Object.assign(JSON.parse(JSON.stringify(t.pay)), {days: old.days || {}, dayPto: old.dayPto || {}, extra: old.extra || {}});
      if (Array.isArray(old.stubs)) for (const s of old.stubs) if (!cur.pay.stubs.some(x => x.check === s.check)) cur.pay.stubs.push(s);
    }
  }
  for (const it of d.items) if (!have.has(it.id)) S.items.push(JSON.parse(JSON.stringify(it)));
  // keep the tile order from the seed (Earnings, Transactions, Budget, Paycheck, Business), then anything she added
  const order = d.tiles.map(t => t.id);
  S.tiles.sort((a, b) => (order.includes(a.id) ? order.indexOf(a.id) : 99) - (order.includes(b.id) ? order.indexOf(b.id) : 99));
  S.seeded = (S.seeded || []).concat(d.id);

}
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || S.v !== 2 || !Array.isArray(S.tiles)) S = fresh();
  if (!Array.isArray(S.items)) S.items = [];
  // 2.2 added the Paycheck calculator tile: give it to existing installs once (she can delete it).
  if (!S.payAdded) { if (!S.tiles.some(t => t.kind === 'pay')) S.tiles.push({id: 'pay', name: 'Paycheck', kind: 'pay', icon: 'calc', pay: defPay()}); S.payAdded = true; save(); }
  if (S.autoUpd == null) S.autoUpd = true;
  for (const t of S.tiles) if (t.kind === 'pay' && t.pay && t.pay.v === 2 && !t.pay.fix3) {
    for (const d of [...(t.pay.pre || []), ...(t.pay.post || [])]) if (d.no3 == null && /medical|dental|vision|insur|illness|life/i.test(d.name || '')) d.no3 = true;
    if (t.pay.start === '2026-09-20' && num(t.pay.lag) === 5) t.pay.lag = 6;   // check date is the Friday (Fritz, 10-18)
    t.pay.fix3 = true;
  }
  if (!S.bothMig) { for (const t of S.tiles) if (!['earn', 'tx', 'budget', 'pay', 'biz'].includes(t.id) && (t.kind === 'in' || t.kind === 'out')) toBoth(t); S.bothMig = true; }
  applySeed();
  for (const t of S.tiles) if (t.kind === 'pay' && (!t.pay || t.pay.v !== 2)) { const r = t.pay ? t.pay.rate : 0; t.pay = defPay(); t.pay.rate = r || 0; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save on this phone'); } }
const tileOf = id => S.tiles.find(t => t.id === id);

/* ---------- months & repeats ---------- */
let curM = today().slice(0, 7);
const mStart = m => m + '-01';
const mEnd = m => { const [y, mo] = m.split('-').map(Number); return `${m}-${pad(monthEnd(y, mo - 1))}`; };
const mLabel = m => { const [y, mo] = m.split('-').map(Number); return `${MON[mo - 1]} ${y}`; };
const mShift = (m, n) => addMonths(mStart(m), n, 1).slice(0, 7);
const FREQ = {week: 'Every week', '2week': 'Every 2 weeks', month: 'Every month', '2month': 'Every 2 months', quarter: 'Every 3 months', year: 'Every year'};
const FREQ_SHORT = {week: 'Weekly', '2week': 'Every 2 weeks', month: 'Monthly', '2month': 'Every 2 months', quarter: 'Every 3 months', year: 'Yearly'};
const repeats = it => !!(it.rep && it.rep.f);
// The nth date of a repeating item (n = 0 is its first date).
function nth(it, n) {
  const f = repeats(it) ? it.rep.f : '', day = pd(it.date).getDate();
  if (f === 'week') return addDays(it.date, 7 * n);
  if (f === '2week') return addDays(it.date, 14 * n);
  if (f === 'month') return addMonths(it.date, n, day);
  if (f === '2month') return addMonths(it.date, 2 * n, day);
  if (f === 'quarter') return addMonths(it.date, 3 * n, day);
  if (f === 'year') return addMonths(it.date, 12 * n, day);
  return it.date;
}
function lastDate(it) {
  if (!repeats(it)) return it.date;
  if (it.rep.end === 'count') return nth(it, Math.max(1, it.rep.count) - 1);
  if (it.rep.end === 'until') return it.rep.until;
  return null;
}
// Every date an item lands on between s and e, with its number in the series.
function occ(it, s, e) {
  const out = [], skip = it.skip || {};
  if (!repeats(it)) { if (it.date >= s && it.date <= e && !skip[it.date]) out.push({d: it.date, n: 1}); return out; }
  const r = it.rep;
  for (let n = 0; n < 5000; n++) {
    const d = nth(it, n);
    if (d > e) break;
    if (r.end === 'count' && n >= r.count) break;
    if (r.end === 'until' && r.until && d > r.until) break;
    if (d >= s && !skip[d]) out.push({d, n: n + 1});
  }
  return out;
}
const amtOf = (it, d) => it.amtOn && it.amtOn[d] != null ? it.amtOn[d] : it.amt;
// Which way an entry's money goes: in/out tiles fix it; "both" tiles let each entry choose.
const dirDefault = T => T && (T.kind === 'in' || T.kind === 'out') ? T.kind : (T && T.defDir) || 'out';
const dirOf = (T, it) => it.dir || dirDefault(T);
const isMoney = T => T && (T.kind === 'in' || T.kind === 'out' || T.kind === 'both');
function entries(tileId, s, e) {
  const out = [], T = tileOf(tileId);
  for (const it of S.items) if (it.tile === tileId) for (const o of occ(it, s, e)) out.push({it, d: o.d, n: o.n, amt: amtOf(it, o.d), dir: dirOf(T, it), done: !!(it.done || {})[o.d]});

}
function tileTotals(t, m) {
  const list = entries(t.id, mStart(m), mEnd(m));
  const inSum = sum(list.filter(x => x.dir === 'in'), x => x.amt), outSum = sum(list.filter(x => x.dir === 'out'), x => x.amt);
  const total = t.kind === 'check' ? sum(list, x => x.amt) : t.kind === 'out' ? r2(outSum - inSum) : r2(inSum - outSum);
  const paid = sum(list.filter(x => x.done), x => x.amt);
  return {list, total, inSum, outSum, paid, left: r2(total - paid), count: list.length, doneCount: list.filter(x => x.done).length};
}
function repText(it, n) {

  const r = it.rep;
  let s = FREQ_SHORT[r.f];
  if (r.end === 'count') s += n ? ` · ${n} of ${r.count}` : ` · ${r.count} times`;
  else if (r.end === 'until') s += ` · until ${shortD(r.until)}`;

}

/* ---------- sheets / dialogs ---------- */
const stack = [];
function sheet(title, body, o = {}) {

  document.body.appendChild(el);

  stack.push({el, onClose: o.onClose});
  el.querySelector('[data-x]').onclick = () => closeTop();
  if (o.fab) el.querySelector('[data-fab]').onclick = o.fab;
  if (o.mount) o.mount(el);
  return el;
}
function pop(html, o = {}) {
  const el = document.createElement('div'); el.className = 'pop' + (o.dlg ? ' dlg' : '');
  el.innerHTML = `<div class="pc">${html}</div>`;
  document.body.appendChild(el);

}
function closeTop() {

}
function closeAll() { while (stack.length) closeTop(); }
function ask(title, msg, ok, danger) {

    const el = pop(`<h3>${esc(title)}</h3><p>${msg}</p><div class="dlgb"><button data-n>Cancel</button><button data-y class="${danger ? 'danger' : ''}">${esc(ok || 'OK')}</button></div>`, {dlg: true, onClose: () => { if (!done) res(false); }});
    el.querySelector('[data-n]').onclick = () => closeTop();
    el.querySelector('[data-y]').onclick = () => { done = true; closeTop(); res(true); };

}
function choose(title, opts, msg) {
  return new Promise(res => {
    let done = false;
    const el = pop(`<h3>${esc(title)}</h3>${msg ? `<p style="margin:0 18px 8px">${msg}</p>` : ''}` + opts.map((o, i) => `<button class="opt ${o.danger ? 'danger' : ''}" data-i="${i}">${o.icon ? ic(o.icon) : ''}<span>${esc(o.label)}</span></button>`).join(''), {onClose: () => { if (!done) res(null); }});
    el.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { done = true; closeTop(); res(opts[+b.dataset.i].v); });

    } else {

// Unpaid checklist items from the 3 months before the month being viewed (only shown on this month or later).

/* ---------- ITEM FORM ---------- */
function itemForm(it0, occDate) {
  const isNew = !it0.id;
  const T = tileOf(it0.tile);
  const it = Object.assign({name: '', amt: '', date: defDate(), note: '', rep: T.kind === 'check' && isNew ? {f: 'month', end: 'never'} : null}, JSON.parse(JSON.stringify(it0)));
  const oneOK = !isNew && repeats(it) && occDate;   // editing one date of a repeating bill/entry
  let scope = oneOK ? 'one' : 'all';
  if (oneOK) it.amt = amtOf(it, occDate);
  const rep = Object.assign({f: '', end: 'never', count: 12, until: ''}, it.rep || {});
  const both = isMoney(T);   // every money tile can add or take away
  let dir = dirOf(T, it);

/* ---------- PAY ---------- */
// The Paycheck tile plans upcoming pay periods (hours, overtime, premiums) and predicts each check like a real pay stub.
// 2026 federal brackets and standard deductions (IRS Rev. Proc. 2025-32), used with the Pub 15-T percentage method.
const FED26 = {
  single: {std: 16100, br: [12400, 50400, 105700, 201775, 256225, 640600]},
  mfj: {std: 32200, br: [24800, 100800, 211400, 403550, 512450, 768700]},
  hoh: {std: 24150, br: [17700, 67450, 105700, 201750, 256200, 640600]}

const FED_RATES = [.10, .12, .22, .24, .32, .35, .37];

function defPay() {

    sched: [0, 8, 8, 8, 8, 8, 0], days: {}, dayPto: {}, extra: {},
    prem: [{id: 'wknd', name: 'Weekend premium', rate: 0}],
    paid: [{id: 'hol', name: 'Holiday', rate: 0}, {id: 'pto', name: 'Paid time off', rate: 0}, {id: 'sick', name: 'Sick', rate: 0}],
    holidays: [], pre: [], imputed: 0, fed: {status: 'single', step2: false, deps: 0, extra: 0}, state: {name: 'State tax', pct: 0},
    post: [], plans: {}, stubs: [], showPred: true, adj: 0};
}
const perYear = p => (num(p.every) || 14) === 7 ? 52 : 26;
const weeksIn = p => (num(p.every) || 14) === 7 ? 1 : 2;
// Pay periods whose payday is on or after `from`.
function payPeriods(p, from, n) {

const ver = () => (window.Native && Native.versionName) ? Native.versionName() : 'web';
function cmpVer(a, b) { const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; }

function checkUpdate(manual) {

function restore() {

  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();

      let d; try { d = JSON.parse(rd.result); } catch (e) { d = null; }
      if (!d || d.v !== 2 || !Array.isArray(d.tiles) || !Array.isArray(d.items)) { toast("That file isn't a Money Tiles file"); return; }
      const how = await choose('What should I do with this file?', [
        {label: `Add it to what's already in the app`, v: 'merge', icon: 'add'},
        {label: 'Replace everything in the app with it', v: 'replace', icon: 'restore', danger: true}
      ], `${d.tiles.length} tiles · ${d.items.length} entries`);
      if (!how) return;
      if (how === 'replace') {

        localStorage.setItem(KEY, JSON.stringify(d)); load(); closeAll(); refresh(); toast('Done: the app now matches the file'); return;
      }

      for (const t of d.tiles) { const cur = tileOf(t.id); if (!cur) { S.tiles.push(t); nt++; } else if (t.kind === 'pay' && t.pay && t.pay.v === 2 && cur.kind === 'pay' && !(cur.pay && cur.pay.v === 2 && num(cur.pay.rate))) { cur.pay = t.pay; nt++; } }

    </div>
    <div class="fld" style="margin-top:22px"><label>Updates</label><div class="list" style="margin:0">
      <button class="setrow" id="sUpd">${ic('restore')}<span style="flex:1">Check for updates now</span><span class="mut">v${esc(ver())}</span></button></div>
      <div class="hint">New versions install themselves: you get a notification, then an Update now screen. Tap it, then Update on Android's screen. Your entries stay.</div></div>
    <div class="hint" style="margin-top:12px">Everything is saved on this phone only. Back up before switching phones or uninstalling; the backup file goes to your Downloads folder.</div>
    <button class="btn ghost" id="sWipe" style="margin-top:28px">${ic('del')}Erase everything</button>
  </div>`, {icon: 'diamond', mount: el => {
    const q = s => el.querySelector(s);
    q('#sCur').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.currency = b.dataset.c; save(); q('#sCur').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); refresh(); };
    q('#sCsv').onclick = exportCSV;
    q('#sBak').onclick = () => saveFile(`money-tiles-backup-${stamp()}.json`, JSON.stringify(S), 'application/json');
    q('#sRes').onclick = restore;
    q('#sUpd').onclick = () => checkUpdate(true);
    q('#sWipe').onclick = async () => { if (!await ask('Erase everything?', 'All tiles and entries will be deleted from this phone. This cannot be undone.', 'Erase', true)) return; S = fresh(); save(); closeAll(); refresh(); toast('Erased'); };
  }});
}

/* ---------- boot ---------- */
function boot() {
  $('#splashLogo').innerHTML = logo(80);
  $('#appTitle').innerHTML = `<span class="hlogo">${logo(26)}</span>Money Tiles`;
  $('#setBtn').innerHTML = ic('gear');
  $('#mPrev').innerHTML = ic('left'); $('#mNext').innerHTML = ic('right');
  $('#setBtn').onclick = openSettings;
  $('#mPrev').onclick = () => { curM = mShift(curM, -1); refresh(); };
  $('#mNext').onclick = () => { curM = mShift(curM, 1); refresh(); };
  $('#mLbl').onclick = () => { curM = today().slice(0, 7); refresh(); };
  load(); syncPredictions(); renderHome();
  setTimeout(() => checkUpdate(false), 1500);
  // The phone app keeps a report if it ever crashed; show it once so she can send it to Fritz.
  const crash = window.Native && Native.lastCrash ? Native.lastCrash() : '';
  if (crash) setTimeout(() => {
    const el = pop(`<h3>Money Tiles closed unexpectedly</h3><p>Sorry about that. Your entries are safe. Please send this to Fritz so he can fix it.</p><div class="dlgb"><button data-n>Close</button><button data-y>Send to Fritz</button></div>`, {dlg: true});
    el.querySelector('[data-n]').onclick = () => closeTop();
    el.querySelector('[data-y]').onclick = () => { Native.share('Money Tiles crash report', crash); closeTop(); };
  }, 600);
  setTimeout(() => { const s = $('#splash'); if (!s) return; s.style.opacity = 0; setTimeout(() => s.remove(), 400); }, 900);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) { refresh(); if (Date.now() - (S.updLast || 0) > 6e5) checkUpdate(false); } });
boot();
</script>
</body>
</html>
