<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>iSaveMoney</title>
<style>
:root{
  --or:#FF8A1E; --or2:#F57C00; --blue:#1E88E5; --green:#7CB342; --red:#E53935;
  --lav:#F3F0FA; --lav2:#E4E1F3; --ink:#212121; --mut:#6B6B78; --line:#E8E6EF; --bg:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",system-ui,sans-serif;font-size:15px;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.ic{width:24px;height:24px;fill:currentColor;flex:none}
.blue{color:var(--blue)} .green{color:var(--green)} .red{color:var(--red)} .orange{color:var(--or2)} .mut{color:var(--mut)}
.hidden{display:none!important}

/* splash */
#splash{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s}
#splash .logo{width:104px;height:104px;border-radius:30px;background:#EEF0F5;display:flex;align-items:center;justify-content:center}
#splash .spin{position:absolute;bottom:110px;width:14px;height:14px;border:2px solid #ccc;border-top-color:transparent;border-radius:50%;animation:sp 0.9s linear infinite}
#splash .name{position:absolute;bottom:42px;font-size:21px;color:#222}
@keyframes sp{to{transform:rotate(360deg)}}

/* app bar */
#bar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--or);color:#fff;display:flex;align-items:center;padding:0 6px;z-index:10}
#bar .ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%}
#bar .ib:active{background:rgba(255,255,255,.18)}
#title{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden}
#title span{overflow:hidden;text-overflow:ellipsis}
main{padding:56px 0 76px}
.view{display:none} .view.on{display:block}

/* summary card */
.card{background:#fff;border:1px solid var(--line);border-radius:10px;margin:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sum{position:relative;padding:10px 0 0}
.sum .top{display:flex;justify-content:space-between;padding:0 10px}
.sum .top b{display:block;font-size:19px;font-weight:500}
.sum .top small{font-size:12px;color:#333}
.sum .top .r{text-align:right}
.gauge{position:relative;width:172px;margin:-12px auto 0}
.gauge svg{width:172px;height:auto}
.sum .top{position:relative;z-index:1}
.gauge .gl{position:absolute;left:0;right:0;bottom:4px;text-align:center}
.gauge .gl span{display:block;font-size:15px;color:#333}
.gauge .gl b{font-size:19px;font-weight:600}
.pct{text-align:center;font-size:13px;color:#333;margin:4px 0 12px}
.row3{display:flex;justify-content:space-between;padding:0 10px 10px;gap:6px}
.row3 > div{text-align:center;flex:1} .row3 > div:first-child{text-align:left} .row3 > div:last-child{text-align:right}
.row3 small{display:flex;align-items:center;gap:3px;font-size:12.5px;color:#333;white-space:nowrap}
.row3 > div:nth-child(2) small{justify-content:center} .row3 > div:last-child small{justify-content:flex-end}
.row3 b{display:block;font-size:19px;font-weight:500;margin-top:2px}
.row3 .ic{width:16px;height:16px;color:var(--blue)}
.sbar{position:relative;height:26px;background:var(--lav2);font-size:13.5px}
.sbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--or);max-width:100%}
.sbar .fill.over{background:var(--red)}
.sbar .lbl{position:absolute;left:10px;top:0;line-height:26px;color:#222}
.sbar .bp{position:absolute;left:0;right:0;text-align:center;line-height:26px;color:#222;font-weight:500}
.ended{margin:8px;padding:10px 12px;border-radius:10px;background:#FFF3E0;border:1px solid #FFCC80;font-size:14px;display:flex;align-items:center;gap:10px}
.ended button{margin-left:auto;color:#fff;background:var(--or);border-radius:16px;padding:6px 12px;font-weight:500;white-space:nowrap}

/* toolbar */
.tools{display:flex;align-items:center;justify-content:space-between;padding:6px 12px}
.tools .tb{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:#5C6BC0;border-radius:8px}
.tools .tb.on{color:var(--green)}
.tools .tb.view{margin-left:auto;margin-right:16px;color:#333}
.tools .filt{display:flex;align-items:center;gap:10px;border:1.5px solid #7986CB;color:#3949AB;border-radius:6px;padding:6px 14px;margin-right:16px;font-size:15px}
.tools .filt.act{background:#E8EAF6}
.tools .tb.hide{border:1.5px solid #c9c9d6;color:var(--green)}

/* section lists */
.sec{margin:6px 8px 10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.sech{display:flex;align-items:center;justify-content:space-between;background:var(--lav);padding:14px 14px;color:var(--or2);font-weight:500;font-size:15.5px}
.sech .amt{display:flex;align-items:center;gap:6px;font-weight:600}
.row{display:flex;align-items:center;gap:14px;padding:11px 14px;border-top:1px solid var(--line);min-height:62px}
.row:first-of-type{border-top:0}
.row:active{background:#F7F6FB}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:500}
.av .ic{width:20px;height:20px}
.mid{flex:1;min-width:0}
.nm{font-size:16px;color:#222;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:14.5px;color:#666;margin-top:1px}
.amtc{text-align:right;font-size:15px;color:#222;white-space:nowrap}
.amtc small{display:block;font-size:12px;color:var(--mut)}
.pb{height:5px;border-radius:3px;background:var(--lav2);margin-top:6px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--green);border-radius:3px}
.pb i.warn{background:var(--or)} .pb i.over{background:var(--red)}
.compact .row{min-height:48px;padding:7px 14px} .compact .pb{display:none} .compact .av{width:30px;height:30px;font-size:15px}
.addrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);color:var(--blue);font-weight:500}
.empty{padding:22px 16px;text-align:center;color:var(--mut);font-size:14px;line-height:1.5}
.empty button{margin-top:10px}

/* bottom nav + fab */
#nav{position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:10}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;color:#555}
#nav button.on{color:var(--blue)}
#nav .gap{flex:0.8}
#fab{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);width:54px;height:54px;border-radius:50%;background:#FFB627;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.25);z-index:11}
#fab .ic{width:30px;height:30px}
#fab:active{transform:translateX(-50%) scale(.94)}

/* sheets (full screen pages) */
.sheet{position:fixed;inset:0;background:#fff;z-index:30;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
.sheet.in{transform:none}
.sheet .sh{height:56px;flex:none;background:var(--or);color:#fff;display:flex;align-items:center;padding:0 6px;gap:4px}
.sheet .sh h2{flex:1;margin:0;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .sh .ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.sheet .sh .act{padding:8px 12px;font-weight:600;letter-spacing:.3px}
.sheet .sb{flex:1;overflow-y:auto;padding-bottom:30px}
.pop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;opacity:0;transition:opacity .18s}
.pop.in{opacity:1}
.pop .pc{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:8px 0 18px;max-height:85%;overflow:auto;transform:translateY(30px);transition:transform .18s}
.pop.in .pc{transform:none}
.pop.dlg{align-items:center;justify-content:center;padding:24px}
.pop.dlg .pc{border-radius:12px;padding:20px 20px 10px;max-width:360px}
.pc h3{margin:6px 16px 10px;font-size:17px;font-weight:600}
.pop.dlg .pc h3{margin:0 0 10px}
.pc p{margin:0 0 14px;line-height:1.5;color:#444;font-size:14.5px}
.dlgb{display:flex;justify-content:flex-end;gap:6px}
.dlgb button{padding:10px 14px;color:var(--or2);font-weight:600;border-radius:6px}
.dlgb button.danger{color:var(--red)}
.opt{display:flex;align-items:center;gap:16px;padding:14px 20px;font-size:16px}
.opt:active{background:#F5F5F5}
.opt .ic{color:var(--mut)}

/* forms */
.form{padding:8px 16px}
.fld{margin:12px 0}
.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;border:0;border-bottom:1.5px solid #D5D3DE;padding:9px 2px;font-size:16px;background:transparent;outline:none;border-radius:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-bottom-color:var(--or)}
.big input{font-size:30px;font-weight:500}
.seg{display:flex;background:var(--lav);border-radius:10px;padding:4px;margin:10px 0}
.seg button{flex:1;padding:9px 4px;border-radius:8px;font-weight:500;color:#555;font-size:14.5px}
.seg button.on{background:#fff;color:var(--or2);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chk{display:flex;align-items:center;gap:12px;margin:14px 0;font-size:15px}
.chk input{width:20px;height:20px;accent-color:var(--or)}
.btn{display:block;width:100%;padding:13px;border-radius:24px;background:var(--or);color:#fff;font-weight:600;font-size:15.5px;margin-top:16px;text-align:center}
.btn.ghost{background:transparent;color:var(--red);border:1.5px solid #F2B8B5}
.btn.sec2{background:var(--lav);color:var(--or2)}
.hint{font-size:13px;color:var(--mut);margin-top:4px;line-height:1.4}
.colors{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:#333}

/* insight */
.chartcard{padding:14px}
.chartcard h4{margin:0 0 10px;font-size:15px;font-weight:600;color:#333}
.donut{display:flex;align-items:center;justify-content:center;position:relative;margin:4px 0 10px}
.donut .mid2{position:absolute;text-align:center}
.donut .mid2 b{display:block;font-size:20px}
.donut .mid2 small{color:var(--mut);font-size:12.5px}
.leg{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line);font-size:14.5px}
.leg i{width:12px;height:12px;border-radius:3px;flex:none}
.leg .p{color:var(--mut);font-size:13px;width:48px;text-align:right}
.leg .v{width:86px;text-align:right;white-space:nowrap}
.leg span{white-space:nowrap}
.bvb{margin:10px 0}
.bvb .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bvb .tr{height:10px;background:var(--lav2);border-radius:5px;overflow:hidden;position:relative}
.bvb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.legend2{display:flex;gap:14px;font-size:12.5px;color:#555;margin-top:6px}
.legend2 span{display:flex;align-items:center;gap:5px}
.legend2 i{width:10px;height:10px;border-radius:2px}
.stat2{display:flex;gap:8px;margin:8px}
.stat2 .card{flex:1;margin:0;padding:12px}
.stat2 small{font-size:12.5px;color:var(--mut)} .stat2 b{display:block;font-size:18px;font-weight:500;margin-top:3px}

/* accounts */
.nw{padding:16px;text-align:center}
.nw small{color:var(--mut)} .nw b{display:block;font-size:28px;font-weight:500;margin-top:4px}
.btnrow{display:flex;gap:8px;margin:0 8px}
.btnrow .btn{margin-top:0;flex:1;padding:11px}

/* I want to */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.wgrid button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;font-size:14.5px;font-weight:500;min-height:96px}
.wgrid button:active{background:#F7F6FB}
.wgrid .wi{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.wgrid .wi .ic{width:22px;height:22px}
.wh{margin:14px 16px 2px;font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:290px;max-width:84%;background:#fff;z-index:21;transform:translateX(-100%);transition:transform .22s;overflow-y:auto}
#drawer.on{transform:none}
#drawer .dh{background:var(--or);color:#fff;padding:26px 18px 16px}
#drawer .dh .logo{width:56px;height:56px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
#drawer .dh b{font-size:19px} #drawer .dh small{display:block;opacity:.9;margin-top:3px}
#drawer .di{display:flex;align-items:center;gap:20px;padding:13px 18px;font-size:15.5px;color:#333;width:100%;text-align:left}
#drawer .di .ic{color:#666}
#drawer .di.cur{color:var(--or2);background:#FFF5EC}
#drawer .di.cur .ic{color:var(--or2)}
#drawer hr{border:0;border-top:1px solid var(--line);margin:6px 0}
#drawer .dl{padding:10px 18px 4px;font-size:12.5px;color:var(--mut);font-weight:600}

/* misc */
.txr .sub{font-size:13px}
.daysep{padding:8px 14px;font-size:12.5px;color:var(--mut);background:#FAFAFC;border-top:1px solid var(--line);font-weight:500}
.searchbox{display:flex;align-items:center;background:rgba(255,255,255,.22);border-radius:8px;flex:1;margin-right:8px}
.searchbox input{flex:1;background:transparent;border:0;outline:none;color:#fff;padding:10px;font-size:16px}
.searchbox input::placeholder{color:rgba(255,255,255,.8)}
.goal{padding:14px;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal .t{display:flex;justify-content:space-between;align-items:baseline}
.goal .pb{height:9px;border-radius:5px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;max-width:86%;text-align:center}
.toast.on{opacity:1}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.calc button{padding:12px 0;border-radius:10px;background:var(--lav);font-size:18px;font-weight:500}
.calc button.op{color:var(--or2)}
.calc button.eq{background:var(--or);color:#fff}
</style>
</head>
<body>

<div id="splash">
  <div class="logo"><svg width="84" height="84" viewBox="20 20 68 68" id="logoSvg"></svg></div>
  <div class="spin"></div>
  <div class="name">iSaveMoney</div>
</div>

<header id="bar">
  <button class="ib" id="menuBtn" aria-label="Menu"></button>
  <button id="title"><span id="titleTxt"></span></button>
  <button class="ib" id="searchBtn" aria-label="Search"></button>
</header>

<main>
  <section class="view on" id="v-home"></section>
  <section class="view" id="v-insight"></section>
  <section class="view" id="v-accounts"></section>
  <section class="view" id="v-want"></section>
</main>

<nav id="nav">
  <button data-v="home" class="on"></button>
  <button data-v="insight"></button>
  <div class="gap"></div>
  <button data-v="accounts"></button>
  <button data-v="want"></button>
</nav>
<button id="fab" aria-label="Add"></button>

<div id="scrim"></div>
<aside id="drawer"></aside>

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r2 = n => Math.round((+n || 0) * 100) / 100;
const sum = (a, f) => r2(a.reduce((t, x) => t + (f ? f(x) : x), 0));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthEnd = (y, m) => new Date(y, m + 1, 0).getDate();
function addMonths(s, n, day) {
  const d = pd(s); const want = day || d.getDate();

  t.setDate(Math.min(want, monthEnd(t.getFullYear(), t.getMonth())));
  return iso(t);
}
function monthRange(s) { const d = pd(s); return [iso(new Date(d.getFullYear(), d.getMonth(), 1)), iso(new Date(d.getFullYear(), d.getMonth() + 1, 0))]; }
function nice(s) { const d = pd(s); return `${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }
function shortD(s) { const d = pd(s); return `${MON[d.getMonth()]} ${d.getDate()}`; }
function fmt(n) {
  n = r2(n);
  const s = Math.abs(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  return (n < 0 ? '-' : '') + S.currency + s;
}
function money(v) {
  // Accepts "12.50", "1,200", or a simple sum like "12+8.5*2".
  v = String(v || '').replace(/,/g, '').replace(/[^\d.+\-*/() ]/g, '').trim();
  if (!v) return NaN;
  if (!/^[\d.+\-*/() ]+$/.test(v)) return NaN;
  try { const n = Function('"use strict";return (' + v + ')')(); return isFinite(n) ? r2(n) : NaN; } catch (e) { return NaN; }
}
const AVC = ['#4FC3F7','#E57373','#81C784','#FF9800','#BA68C8','#4DB6AC','#F06292','#7986CB','#FFB74D','#A1887F','#90A4AE','#AED581'];
function avColor(name) { let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) | 0; return AVC[Math.abs(h) % AVC.length]; }
function av(name, color) {
  const n = String(name || '').trim();

}
function toast(msg) {

  t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200);

/* ---------- state ---------- */
const KEY = 'isavemoney_v1';
const CAT_COLORS = ['#EF5350','#AB47BC','#5C6BC0','#29B6F6','#26A69A','#66BB6A','#D4E157','#FFCA28','#FFA726','#8D6E63','#78909C','#EC407A'];
const DEFAULT_CATS = ['Rent / Mortgage','Groceries','Utilities','Phone & Internet','Transportation','Dining Out','Entertainment','Subscriptions','Health','Shopping','Insurance','Personal Care','Debt Payments','Gifts & Donations','Miscellaneous'];
let S;
function fresh() {
  return {
    v: 1, currency: '$',
    cats: DEFAULT_CATS.map((n, i) => ({id: uid() + i, name: n, color: CAT_COLORS[i % CAT_COLORS.length], def: 0})),
    accounts: [{id: 'acc-checking', name: 'Checking', type: 'Bank', open: 0}, {id: 'acc-cash', name: 'Cash', type: 'Cash', open: 0}],
    budgets: [], tx: [], rec: [], goals: [],
    ui: {sort: 'amount', compact: false, showEmpty: false, openInc: true, openExp: true, acct: '', defAcct: 'acc-checking'},
    cur: null
  };
}
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || !S.v) S = fresh();
  const f = fresh();
  for (const k of Object.keys(f)) if (S[k] == null) S[k] = f[k];
  S.ui = Object.assign(f.ui, S.ui);
  ensureBudget();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save on this device'); } }
function ensureBudget() {
  const t = today();
  if (!S.budgets.length) {
    const [a, b] = monthRange(t);
    S.budgets.push({id: uid(), name: '', start: a, end: b, limits: defLimits()});
  }
  // Open the budget that covers today; otherwise keep the chosen one; otherwise the latest.
  const cover = S.budgets.filter(b => b.start <= t && b.end >= t).sort((x, y) => y.start.localeCompare(x.start))[0];
  if (!S._picked && cover) S.cur = cover.id;
  if (!S.budgets.find(b => b.id === S.cur)) S.cur = (cover || latest()).id;
}
function defLimits() { const o = {}; for (const c of S.cats) if (c.def > 0) o[c.id] = c.def; return o; }
const latest = () => S.budgets.slice().sort((a, b) => b.start.localeCompare(a.start))[0];
const B = () => S.budgets.find(b => b.id === S.cur);
const cat = id => S.cats.find(c => c.id === id);
const acct = id => S.accounts.find(a => a.id === id);
const catName = id => (cat(id) || {name: 'Uncategorized'}).name;
const acctName = id => (acct(id) || {name: '—'}).name;
function label(b) {
  const a = pd(b.start), e = pd(b.end);
  if (b.name) return b.name;
  if (a.getFullYear() === e.getFullYear()) {
    if (a.getMonth() === e.getMonth()) return `${MON[a.getMonth()]} ${a.getDate()} - ${e.getDate()}, ${a.getFullYear()}`;
    return `${MON[a.getMonth()]} ${a.getDate()} - ${MON[e.getMonth()]} ${e.getDate()}, ${a.getFullYear()}`;
  }
  return `${shortD(b.start)}, ${a.getFullYear()} - ${shortD(b.end)}, ${e.getFullYear()}`;
}
function calc(b, accFilter) {
  const t = S.tx.filter(x => x.date >= b.start && x.date <= b.end && (!accFilter || x.acct === accFilter));
  const inc = t.filter(x => x.type === 'income'), exp = t.filter(x => x.type === 'expense');
  const income = sum(inc, x => x.amt), spent = sum(exp, x => x.amt);
  const budgeted = sum(Object.values(b.limits || {}));
  const by = {}; for (const x of exp) by[x.cat || ''] = r2((by[x.cat || ''] || 0) + x.amt);
  return {inc, exp, income, spent, budgeted, by, saving: r2(income - spent), prov: r2(income - budgeted), remain: r2(budgeted - spent)};
}

/* ---------- recurring ---------- */
const FREQ = {weekly: 'Every week', biweekly: 'Every 2 weeks', monthly: 'Every month', quarterly: 'Every 3 months', yearly: 'Every year'};
function nextDate(r, s) {
  if (r.freq === 'weekly') return addDays(s, 7);
  if (r.freq === 'biweekly') return addDays(s, 14);
  if (r.freq === 'monthly') return addMonths(s, 1, r.day);
  if (r.freq === 'quarterly') return addMonths(s, 3, r.day);
  return addMonths(s, 12, r.day);
}
function runRecurring() {
  const t = today(); let n = 0;
  for (const r of S.rec) {
    let guard = 0;
    while (r.next <= t && guard++ < 500) {
      S.tx.push(Object.assign({}, r.tpl, {id: uid(), date: r.next, rec: r.id}));
      r.next = nextDate(r, r.next); n++;
    }
  }
  if (n) { save(); toast(`${n} recurring transaction${n > 1 ? 's' : ''} added`); }
}

/* ---------- sheets / dialogs ---------- */
const stack = [];
function sheet(title, body, o = {}) {
  const el = document.createElement('div'); el.className = 'sheet';
  el.innerHTML = `<div class="sh"><button class="ib" data-x>${ic('back')}</button><h2>${esc(title)}</h2>${o.head || ''}${o.action ? `<button class="act" data-act>${esc(o.action)}</button>` : ''}</div><div class="sb">${body}</div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  const rec = {el, close: () => closeTop(), onClose: o.onClose};
  stack.push(rec);
  el.querySelector('[data-x]').onclick = () => closeTop();
  if (o.action) el.querySelector('[data-act]').onclick = () => o.onAction(el);
  if (o.mount) o.mount(el);
  return el;
}
function pop(html, o = {}) {
  const el = document.createElement('div'); el.className = 'pop' + (o.dlg ? ' dlg' : '');
  el.innerHTML = `<div class="pc">${html}</div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  stack.push({el, isPop: true, onClose: o.onClose});

}
function closeTop() {

      {dlg: true, onClose: () => { if (!done) res(false); }});

}
function info(title, msg) {

  </div>`;

  // income grouped by payee

  const sub = isT ? 'Transfer' : x.type === 'income' ? `Income · ${acctName(x.acct)}` : `${catName(x.cat)} · ${acctName(x.acct)}`;

  const amt = isT ? fmt(x.amt) : x.type === 'income' ? '+' + fmt(x.amt) : '-' + fmt(x.amt);
  return `<div class="row txr" onclick="editTx('${x.id}')">${isT ? `<div class="av" style="background:#78909C">${ic('swap')}</div>` : av(x.payee || (x.type === 'expense' ? catName(x.cat) : ''), color)}<div class="mid"><div class="nm">${esc(nm)}${x.rec ? ' ' + ic('repeat', 'mut').replace('class="ic', 'style="width:14px;height:14px;display:inline;vertical-align:-2px" class="ic') : ''}</div><div class="sub">${esc(sub)}${showDate ? ' · ' + shortD(x.date) : ''}${x.note ? ' · ' + esc(x.note) : ''}</div></div><div class="amtc ${x.type === 'income' ? 'green' : ''}">${amt}</div></div>`;
}
function txList(list, empty) {

  list = list.slice().sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
  let h = '', last = '';
  for (const x of list) { if (x.date !== last) { h += `<div class="daysep">${nice(x.date)}</div>`; last = x.date; } h += txRow(x, false); }
  return h;
}
window.editTx = id => { const x = S.tx.find(t => t.id === id); if (x) txForm(x); };
function payees(type) {
  const m = {}; for (const x of S.tx) if (x.payee && x.type === type) m[x.payee] = (m[x.payee] || 0) + 1;
  return Object.keys(m).sort((a, b) => m[b] - m[a]).slice(0, 60);
}

function nextPeriod(b) {
  const a = pd(b.start), e = pd(b.end);
  const wholeMonth = a.getDate() === 1 && e.getDate() === monthEnd(e.getFullYear(), e.getMonth());
  if (wholeMonth) {
    const months = (e.getFullYear() - a.getFullYear()) * 12 + e.getMonth() - a.getMonth() + 1;
    const s = iso(new Date(e.getFullYear(), e.getMonth() + 1, 1));
    return [s, iso(new Date(e.getFullYear(), e.getMonth() + 1 + months, 0))];
  }
  const len = daysBetween(b.start, b.end);
  const s = addDays(b.end, 1);
  return [s, addDays(s, len)];
}

    <label class="chk"><input type="checkbox" id="bCarry">Carry over what's left from ${esc(label(preset.copyFrom || cur))} as income</label>` : ''}
    <button class="btn" id="bSave">${isNew ? 'Create budget' : 'Save'}</button>
    ${!isNew && S.budgets.length > 1 ? `<button class="btn ghost" id="bDel">Delete this budget</button><div class="hint">Deleting a budget keeps its transactions; they stay in your accounts and show up in any budget that covers their dates.</div>` : ''}
  </div>`;

/* ---------- INSIGHT ---------- */
let insTab = 'exp';
function donut(parts, total, centre, sub) {
  let acc = 0;
  const segs = parts.map(p => { const v = total > 0 ? p.v / total * 100 : 0; const s = `<circle r="15.915" cx="21" cy="21" fill="none" stroke="${p.c}" stroke-width="6" stroke-dasharray="${v} ${100 - v}" stroke-dashoffset="${25 - acc}"/>`; acc += v; return s; }).join('');
  return `<div class="donut"><svg viewBox="0 0 42 42" width="210" height="210"><circle r="15.915" cx="21" cy="21" fill="none" stroke="#EEEDF5" stroke-width="6"/>${segs}</svg><div class="mid2"><b>${centre}</b><small>${sub}</small></div></div>`;
}
function monthsBack(n) {
  const out = [], d = new Date(); d.setDate(1);
  for (let i = n - 1; i >= 0; i--) { const m = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push({lbl: MON[m.getMonth()], s: iso(m), e: iso(new Date(m.getFullYear(), m.getMonth() + 1, 0))}); }
  return out;
}
function renderInsight() {
  const b = B(), c = calc(b, S.ui.acct);

  if (insTab === 'exp') {
    const parts = Object.entries(c.by).map(([id, v]) => ({id, v, n: catName(id), c: (cat(id) || {color: '#9E9E9E'}).color})).sort((a, b) => b.v - a.v);
    h += `<div class="card chartcard"><h4>Where your money went</h4>${parts.length ? donut(parts, c.spent, fmt(c.spent), 'spent') + parts.map(p => `<div class="leg" onclick="openCat('${p.id}')"><i style="background:${p.c}"></i><span style="flex:1">${esc(p.n)}</span><span class="p">${(p.v / c.spent * 100).toFixed(1)}%</span><span class="v">${fmt(p.v)}</span></div>`).join('') : '<div class="empty">No spending in this budget yet.</div>'}</div>`;
    const rows = S.cats.map(k => ({k, lim: (b.limits || {})[k.id] || 0, sp: c.by[k.id] || 0})).filter(r => r.lim || r.sp).sort((a, b) => b.lim - a.lim);
    if (rows.length) {
      const mx = Math.max(...rows.map(r => Math.max(r.lim, r.sp)));
      h += `<div class="card chartcard"><h4>Budget vs actual</h4>${rows.map(r => `<div class="bvb"><div class="t"><span>${esc(r.k.name)}</span><span class="${r.sp > r.lim ? 'red' : 'mut'}">${fmt(r.sp)} / ${fmt(r.lim)}</span></div><div class="tr"><i style="width:${r.lim / mx * 100}%;background:#D1CDEB"></i><i style="width:${r.sp / mx * 100}%;background:${r.sp > r.lim ? 'var(--red)' : r.k.color};height:60%;top:20%"></i></div></div>`).join('')}<div class="legend2"><span><i style="background:#D1CDEB"></i>Budgeted</span><span><i style="background:var(--green)"></i>Spent</span></div></div>`;
    }
    h += dailyChart(b, c);
    const pm = {}; for (const x of c.exp) { const k = x.payee || catName(x.cat); pm[k] = r2((pm[k] || 0) + x.amt); }
    const tp = Object.entries(pm).sort((a, b) => b[1] - a[1]).slice(0, 6);
    if (tp.length) h += `<div class="card chartcard"><h4>Top payees</h4>${tp.map(([n, v]) => `<div class="leg">${av(n).replace('class="av"', 'class="av" style="width:28px;height:28px;font-size:14px;background:' + avColor(n) + '"')}<span style="flex:1">${esc(n)}</span><span class="v">${fmt(v)}</span></div>`).join('')}</div>`;
  } else if (insTab === 'inc') {
    const g = {}; for (const x of c.inc) { const k = x.payee || '?'; g[k] = r2((g[k] || 0) + x.amt); }
    const parts = Object.entries(g).map(([n, v]) => ({n, v, c: avColor(n)})).sort((a, b) => b.v - a.v);
    h += `<div class="card chartcard"><h4>Income sources</h4>${parts.length ? donut(parts, c.income, fmt(c.income), 'income') + parts.map(p => `<div class="leg"><i style="background:${p.c}"></i><span style="flex:1">${esc(p.n)}</span><span class="p">${(p.v / c.income * 100).toFixed(1)}%</span><span class="v">${fmt(p.v)}</span></div>`).join('') : '<div class="empty">No income in this budget yet.</div>'}</div>`;
    h += `<div class="stat2"><div class="card"><small>Saved</small><b class="${c.saving < 0 ? 'red' : 'green'}">${fmt(c.saving)}</b></div><div class="card"><small>Savings rate</small><b>${c.income > 0 ? (c.saving / c.income * 100).toFixed(1) : '0.0'}%</b></div></div>`;
  } else {
    const ms = monthsBack(6).map(m => { const f = S.tx.filter(x => x.date >= m.s && x.date <= m.e); return Object.assign(m, {i: sum(f.filter(x => x.type === 'income'), x => x.amt), x: sum(f.filter(x => x.type === 'expense'), x => x.amt)}); });
    const mx = Math.max(1, ...ms.map(m => Math.max(m.i, m.x)));
    const W = 340, H = 180, bw = 18, gap = W / 6;
    let bars = '';

      const hi = m.i / mx * (H - 30), hx = m.x / mx * (H - 30);
      bars += `<rect x="${x0}" y="${H - 20 - hi}" width="${bw}" height="${hi}" rx="3" fill="#8BC34A"/><rect x="${x0 + bw + 2}" y="${H - 20 - hx}" width="${bw}" height="${hx}" rx="3" fill="#FF8A1E"/><text x="${k * gap + gap / 2}" y="${H - 4}" text-anchor="middle" font-size="11" fill="#666">${m.lbl}</text>`;
    });
    h += `<div class="card chartcard"><h4>Income vs expenses, last 6 months</h4><svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="0" x2="${W}" y1="${H - 20}" y2="${H - 20}" stroke="#ddd"/>${bars}</svg><div class="legend2"><span><i style="background:#8BC34A"></i>Income</span><span><i style="background:#FF8A1E"></i>Expenses</span></div></div>`;
    h += `<div class="card chartcard"><h4>Monthly summary</h4>${ms.slice().reverse().map(m => `<div class="leg"><span style="flex:1">${m.lbl} '${m.s.slice(2, 4)}</span><span class="v green">${fmt(m.i)}</span><span class="v">${fmt(m.x)}</span><span class="v ${m.i - m.x < 0 ? 'red' : 'blue'}">${fmt(m.i - m.x)}</span></div>`).join('')}<div class="legend2" style="justify-content:flex-end"><span>income · spent · saved</span></div></div>`;
    const avg = sum(ms, m => m.x) / 6;
    h += `<div class="stat2"><div class="card"><small>Average monthly spending</small><b>${fmt(avg)}</b></div><div class="card"><small>Average monthly income</small><b>${fmt(sum(ms, m => m.i) / 6)}</b></div></div>`;
    h += `<div class="stat2"><div class="card"><small>Forecast next 6 months (spending)</small><b>${fmt(avg * 6)}</b></div><div class="card"><small>Forecast next 6 months (saved)</small><b class="${sum(ms, m => m.i - m.x) < 0 ? 'red' : 'green'}">${fmt(sum(ms, m => m.i - m.x))}</b></div></div>`;
  }
  $('#v-insight').innerHTML = h;
}
window.renderInsight = renderInsight;
Object.defineProperty(window, 'insTab', {get: () => insTab, set: v => { insTab = v; }});
function dailyChart(b, c) {
  const n = daysBetween(b.start, b.end) + 1; if (n < 2 || n > 400) return '';
  const per = {}; for (const x of c.exp) per[x.date] = (per[x.date] || 0) + x.amt;
  const t = today(); let run = 0; const pts = [];
  for (let i = 0; i < n; i++) { const d = addDays(b.start, i); if (d > t) break; run += per[d] || 0; pts.push(run); }
  const mx = Math.max(c.budgeted, run, 1), W = 340, H = 150;
  const X = i => i / (n - 1) * (W - 10) + 5, Y = v => H - 18 - v / mx * (H - 30);
  const line = pts.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  return `<div class="card chartcard"><h4>Spending pace</h4><svg viewBox="0 0 ${W} ${H}" width="100%">
    <line x1="5" x2="${W - 5}" y1="${H - 18}" y2="${H - 18}" stroke="#ddd"/>
    ${c.budgeted ? `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(n - 1)}" y2="${Y(c.budgeted)}" stroke="#B0B0C8" stroke-dasharray="4 4"/>` : ''}
    ${pts.length ? `<path d="${line}" fill="none" stroke="#FF8A1E" stroke-width="2.5" stroke-linejoin="round"/>` : ''}
    <text x="5" y="${H - 3}" font-size="11" fill="#666">${shortD(b.start)}</text><text x="${W - 5}" y="${H - 3}" font-size="11" fill="#666" text-anchor="end">${shortD(b.end)}</text>
  </svg><div class="legend2"><span><i style="background:#FF8A1E"></i>Spent so far</span>${c.budgeted ? '<span><i style="background:#B0B0C8"></i>Even pace to budget</span>' : ''}</div></div>`;
}

function bal(a) {

    <div class="fld"><label>Goal name</label><input id="gN" value="${esc(g.name || '')}" placeholder="e.g. Emergency fund"></div>
    <div class="fld"><label>Target amount</label><input id="gT" inputmode="decimal" value="${g.target || ''}" placeholder="0.00"></div>
    <div class="fld"><label>Saved so far</label><input id="gS" inputmode="decimal" value="${g.saved || ''}" placeholder="0.00"></div>
    <div class="fld"><label>Target date (optional)</label><input type="date" id="gD" value="${g.by || ''}"></div>
    <button class="btn" id="gSave">${isNew ? 'Create goal' : 'Save'}</button>
    ${!isNew ? `<button class="btn ghost" id="gDel">Delete goal</button>` : ''}</div>`, {
    mount: el => {
      const q = s => el.querySelector(s);
      q('#gSave').onclick = () => {
        const name = q('#gN').value.trim(), target = money(q('#gT').value);
        if (!name || !(target > 0)) { toast('Enter a name and a target'); return; }
        const o = {name, target, saved: money(q('#gS').value) || 0, by: q('#gD').value};
        if (isNew) S.goals.push(Object.assign({id: uid()}, o)); else Object.assign(g, o);
        save(); closeTop(); refresh();
      };
      if (q('#gAddB')) q('#gAddB').onclick = () => {
        const raw = q('#gAdd').value.trim(); const neg = raw.startsWith('-'); let v = money(raw.replace(/^-/, '')); if (!(v > 0)) return; if (neg) v = -v;
        g.saved = r2(Math.max(0, g.saved + v)); save(); q('#gS').value = g.saved; q('#gAdd').value = ''; refresh();
        toast(g.saved >= g.target ? 'Goal reached!' : `${fmt(g.target - g.saved)} to go`);
      };
      if (q('#gDel')) q('#gDel').onclick = async () => { if (!await ask('Delete goal?', esc(g.name), 'Delete', true)) return; S.goals = S.goals.filter(x => x.id !== g.id); save(); closeTop(); refresh(); };
    }
  });
};

/* ---------- recurring list ---------- */
window.openRecurring = () => {
  const el = sheet('Recurring transactions', '', {});
  const draw = () => {
    el.querySelector('.sb').innerHTML = (S.rec.length ? `<div class="sec">${S.rec.slice().sort((a, b) => a.next.localeCompare(b.next)).map(r => `<div class="row" data-r="${r.id}">${av(r.tpl.payee || catName(r.tpl.cat), r.tpl.type === 'expense' ? (cat(r.tpl.cat) || {}).color : null)}<div class="mid"><div class="nm">${esc(r.tpl.payee || (r.tpl.type === 'transfer' ? 'Transfer' : catName(r.tpl.cat)))}</div><div class="sub">${FREQ[r.freq]} · next ${shortD(r.next)}</div></div><div class="amtc ${r.tpl.type === 'income' ? 'green' : ''}">${r.tpl.type === 'income' ? '+' : r.tpl.type === 'expense' ? '-' : ''}${fmt(r.tpl.amt)}</div></div>`).join('')}</div>`
      : `<div class="empty">No recurring transactions.<br>When you add a bill, paycheck or subscription, set <b>Repeat</b> and it will be added automatically each time it comes due.</div>`)
      + `<div class="form"><button class="btn" onclick="txForm({type:'expense'})">Add a recurring bill</button></div>`;
    el.querySelectorAll('[data-r]').forEach(row => row.onclick = () => {
      const r = S.rec.find(x => x.id === row.dataset.r);
      choose(r.tpl.payee || 'Recurring', [
        {label: 'Edit the latest one', icon: 'edit', fn: () => { const l = S.tx.filter(t => t.rec === r.id).sort((a, b) => b.date.localeCompare(a.date))[0]; if (l) txForm(l); else toast('Nothing posted yet; it starts ' + nice(r.next)); }},
        {label: 'Skip the next one (' + shortD(r.next) + ')', icon: 'right', fn: () => { r.next = nextDate(r, r.next); save(); refresh(); toast('Next one is ' + nice(r.next)); }},
        {label: 'Stop repeating', icon: 'del', fn: async () => { if (await ask('Stop repeating?', 'Transactions already added are kept.', 'Stop', true)) { S.rec = S.rec.filter(x => x.id !== r.id); for (const t of S.tx) if (t.rec === r.id) t.rec = ''; save(); refresh(); } }}
      ]);
    });
  };
  el._refresh = draw; draw();
};

/* ---------- search ---------- */
window.openSearch = () => {
  const el = sheet('', '', {});
  el.querySelector('h2').outerHTML = `<div class="searchbox"><input id="sq" placeholder="Search payee, category, note, amount" autocomplete="off"></div>`;
  const inp = el.querySelector('#sq');
  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    const res = !q ? [] : S.tx.filter(x => [x.payee, x.note, catName(x.cat), acctName(x.acct), String(x.amt), x.type].join(' ').toLowerCase().includes(q));
    el.querySelector('.sb').innerHTML = q ? `<div class="hint" style="padding:10px 16px">${res.length} result${res.length === 1 ? '' : 's'} · ${fmt(sum(res.filter(x => x.type === 'expense'), x => x.amt))} spent · ${fmt(sum(res.filter(x => x.type === 'income'), x => x.amt))} received</div><div class="sec">${txList(res.slice(0, 300), 'Nothing matches.')}</div>` : `<div class="empty">Search every transaction in every budget.</div>`;
  };
  inp.oninput = draw; el._refresh = draw; draw();
  setTimeout(() => inp.focus(), 280);
};

    ['Add income', 'inc', '#66BB6A', () => txForm({type: 'income'})],

  ]],

function renderWant() {

}
window.WANT = WANT;

/* ---------- data ---------- */
function saveFile(name, text, mime) {
  if (window.Native && Native.save) { Native.save(name, text, mime); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: mime})); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast('Saved ' + name);
}
function stamp() { const d = new Date(); return `${iso(d)}-${pad(d.getHours())}${pad(d.getMinutes())}`; }
window.exportCSV = () => {
  const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const rows = [['Date', 'Type', 'Payee', 'Category', 'Account', 'To account', 'Amount', 'Note']];
  for (const x of S.tx.slice().sort((a, b) => a.date.localeCompare(b.date))) rows.push([x.date, x.type, x.payee, x.type === 'expense' ? catName(x.cat) : '', acctName(x.acct), x.to ? acctName(x.to) : '', (x.type === 'expense' ? -x.amt : x.amt).toFixed(2), x.note]);
  saveFile(`isavemoney-${stamp()}.csv`, rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
};
window.backup = () => saveFile(`isavemoney-backup-${stamp()}.json`, JSON.stringify(S), 'application/json');
window.restore = () => {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json,text/plain,*/*';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      let d; try { d = JSON.parse(rd.result); } catch (e) { toast('That file is not an iSaveMoney backup'); return; }
      if (!d || !Array.isArray(d.tx) || !Array.isArray(d.budgets)) { toast('That file is not an iSaveMoney backup'); return; }
      if (!await ask('Restore this backup?', `${d.tx.length} transactions and ${d.budgets.length} budgets. Everything currently in the app will be replaced.`, 'Restore', true)) return;
      S = d; localStorage.setItem(KEY, JSON.stringify(S)); load(); closeAll(); go('home'); toast('Backup restored');
    };
    rd.readAsText(f);
  };
  inp.click();
};
window.openSettings = () => {
  const cur = ['$', '€', '£', '¥', '₹', '₦', '₱', 'R', 'R$', 'C$', 'A$', 'CHF ', 'kr '];
  sheet('Settings', `<div class="form">
    <div class="fld"><label>Currency symbol</label><select id="sC">${cur.map(c => `<option ${S.currency === c ? 'selected' : ''} value="${esc(c)}">${esc(c.trim())}</option>`).join('')}${cur.includes(S.currency) ? '' : `<option selected>${esc(S.currency)}</option>`}</select></div>
    <div class="fld"><label>Or type your own</label><input id="sC2" placeholder="e.g. KSh " value=""></div>
    <div class="fld"><label>Default account for new transactions</label><select id="sA">${S.accounts.map(a => `<option value="${a.id}" ${S.ui.defAcct === a.id ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div>
    <button class="btn" id="sSave">Save</button>
    <div class="wh" style="margin:28px 0 6px">Sample data</div>
    <div class="hint">Fills the app with a month of example income and spending so you can see how everything works. It replaces what's there now.</div>
    <button class="btn sec2" id="sSample">Load sample data</button>
    <div class="wh" style="margin:28px 0 6px">Danger zone</div>
    <button class="btn ghost" id="sWipe">Erase everything</button>
    <div class="hint" style="margin-top:24px">iSaveMoney · everything is stored on this phone only. Use <b>Back up my data</b> before uninstalling or switching phones.</div>
  </div>`, {
    mount: el => {
      const q = s => el.querySelector(s);
      q('#sSave').onclick = () => { S.currency = q('#sC2').value || q('#sC').value; S.ui.defAcct = q('#sA').value; save(); closeTop(); refresh(); toast('Saved'); };
      q('#sSample').onclick = () => loadSample();
      q('#sWipe').onclick = async () => { if (!await ask('Erase everything?', 'All budgets, transactions, accounts and goals will be deleted from this phone. This cannot be undone.', 'Erase', true)) return; S = fresh(); ensureBudget(); save(); closeAll(); go('home'); toast('Erased'); };
    }
  });
};

/* ---------- sample data (mirrors the screenshot's numbers for the current month) ---------- */
window.loadSample = async () => {
  if (S.tx.length && !await ask('Load sample data?', 'This replaces everything currently in the app.', 'Load', true)) return;
  S = fresh(); const [ms, me] = monthRange(today()); const days = pd(me).getDate();
  const byName = n => S.cats.find(c => c.name === n).id;
  S.accounts = [{id: 'acc-checking', name: 'Checking', type: 'Bank', open: 2450}, {id: 'acc-savings', name: 'Savings', type: 'Savings', open: 5200}, {id: 'acc-cash', name: 'Cash', type: 'Cash', open: 120}, {id: 'acc-card', name: 'Credit card', type: 'Credit card', open: -380}];
  const limits = {'Rent / Mortgage': 1200, 'Groceries': 450, 'Utilities': 220, 'Phone & Internet': 120, 'Transportation': 260, 'Dining Out': 150, 'Entertainment': 90, 'Subscriptions': 63.40, 'Health': 100, 'Shopping': 100};
  for (const [n, v] of Object.entries(limits)) byName(n) && (S.cats.find(c => c.name === n).def = v);
  const b = {id: uid(), name: '', start: ms, end: me, limits: {}};
  for (const [n, v] of Object.entries(limits)) b.limits[byName(n)] = v;
  S.budgets = [b]; S.cur = b.id;
  const lastDay = Math.min(days, pd(today()).getDate());
  const day = k => iso(new Date(pd(ms).getFullYear(), pd(ms).getMonth(), Math.max(1, Math.round(k / 16 * lastDay))));
  const add = (type, amt, d, payee, catN, acc, note) => S.tx.push({id: uid(), ts: Date.now(), type, amt: r2(amt), date: d, payee, cat: catN ? byName(catN) : '', acct: acc || 'acc-checking', to: '', note: note || ''});
  [['Mine', 1163.32, 1], ['Current', 156.08, 5], ['Concur', 150.68, 9], ['BlueVine', 77, 12], ['', 17.10, 14]].forEach(([p, a, d]) => add('income', a, day(d), p));
  const spend = {
    'Groceries': [[1, 'Safeway', 96.12], [8, 'Costco', 142.88], [15, "Trader Joe's", 73.45]],
    'Utilities': [[3, 'SRP', 141.70], [6, 'City Water', 42.50]],
    'Phone & Internet': [[2, 'Verizon', 119.99]],
    'Transportation': [[4, 'Shell', 48.20], [10, 'QuikTrip', 52.63], [13, 'Car wash', 18.00], [16, 'Shell', 86.80]],
    'Dining Out': [[5, 'Chipotle', 24.35], [7, 'Starbucks', 17.45], [11, 'Olive Garden', 100.00]],
    'Entertainment': [[9, 'AMC Theatres', 64.00]],
    'Subscriptions': [[1, 'Netflix', 22.99], [3, 'Spotify', 11.99], [12, 'iCloud', 12.99]],
    'Health': [[6, 'CVS', 35.00]],
    'Shopping': [[4, 'Amazon', 131.53], [14, 'Target', 125.00]]
  };
  for (const [c, list] of Object.entries(spend)) for (const [d, p, a] of list) add('expense', a, day(d), p, c, p === 'Amazon' || p === 'Olive Garden' ? 'acc-card' : p === 'Car wash' ? 'acc-cash' : 'acc-checking');
  // five earlier months for the Trends tab
  for (let m = 1; m <= 5; m++) {
    const s = addMonths(ms, -m, 1);
    const d = k => addDays(s, k - 1);
    add('income', 2400 + m * 37.5, d(1), 'Mine'); add('income', 160 + m * 11, d(15), 'Current');
    add('expense', 1200, d(1), 'Landlord', 'Rent / Mortgage');
    add('expense', 380 + m * 19, d(9), 'Costco', 'Groceries'); add('expense', 160 + m * 13, d(5), 'SRP', 'Utilities');
    add('expense', 119.99, d(2), 'Verizon', 'Phone & Internet'); add('expense', 190 + m * 8, d(12), 'Shell', 'Transportation');
    add('expense', 110 + m * 21, d(18), 'Chipotle', 'Dining Out'); add('expense', 47.97, d(3), 'Netflix', 'Subscriptions');
    add('expense', 60 + m * 30, d(21), 'Amazon', 'Shopping', 'acc-card');
    S.tx.push({id: uid(), ts: Date.now(), type: 'transfer', amt: r2(60 + m * 30), date: d(25), payee: '', cat: '', acct: 'acc-checking', to: 'acc-card', note: 'Card payment'});
  }
  S.tx.push({id: uid(), ts: Date.now(), type: 'transfer', amt: 200, date: day(15), payee: '', cat: '', acct: 'acc-checking', to: 'acc-savings', note: 'Monthly savings'});
  const rr = {id: uid(), freq: 'monthly', day: 1, next: addMonths(ms, 1, 1), tpl: {type: 'expense', amt: 22.99, acct: 'acc-checking', payee: 'Netflix', cat: byName('Subscriptions'), to: '', note: ''}};
  S.rec.push(rr); S.tx.find(t => t.payee === 'Netflix' && t.date === day(1)).rec = rr.id;
  S.goals = [{id: uid(), name: 'Emergency fund', target: 10000, saved: 5200, by: addMonths(ms, 10, 1)}, {id: uid(), name: 'Summer trip', target: 1800, saved: 640, by: addMonths(ms, 7, 1)}];
  save(); closeAll(); go('home'); toast('Sample data loaded');
};

/* ---------- drawer ---------- */
function renderDrawer() {
  const list = S.budgets.slice().sort((a, b) => b.start.localeCompare(a.start)).slice(0, 6);
  $('#drawer').innerHTML = `<div class="dh"><div class="logo"><svg width="46" height="46" viewBox="20 20 68 68">${LOGO}</svg></div><b>iSaveMoney</b><small>${S.tx.length} transactions · ${S.budgets.length} budget${S.budgets.length > 1 ? 's' : ''}</small></div>
    <div class="dl">BUDGETS</div>
    ${list.map(b => `<button class="di ${b.id === S.cur ? 'cur' : ''}" data-b="${b.id}">${ic('event')}${esc(label(b))}</button>`).join('')}
    <button class="di" data-a="all">${ic('list')}All budgets</button>
    <button class="di" data-a="new">${ic('add')}New budget</button>
    <hr>
    <button class="di" data-a="set">${ic('tune')}Set my budgets</button>
    <button class="di" data-a="cats">${ic('cat')}Categories</button>
    <button class="di" data-a="rec">${ic('repeat')}Recurring</button>
    <button class="di" data-a="goals">${ic('flag')}Savings goals</button>
    <hr>
    <button class="di" data-a="csv">${ic('dl')}Export to CSV</button>
    <button class="di" data-a="bak">${ic('backup')}Back up</button>
    <button class="di" data-a="res">${ic('restore')}Restore</button>
    <button class="di" data-a="settings">${ic('gear')}Settings</button>`;
  const A = {all: openBudgets, new: () => budgetForm(), set: setBudgets, cats: openCats, rec: openRecurring, goals: openGoals, csv: exportCSV, bak: backup, res: restore, settings: openSettings};
  $('#drawer').querySelectorAll('[data-b]').forEach(x => x.onclick = () => { S.cur = x.dataset.b; S._picked = true; save(); drawer(false); go('home'); });
  $('#drawer').querySelectorAll('[data-a]').forEach(x => x.onclick = () => { drawer(false); setTimeout(A[x.dataset.a], 120); });
}

/* ---------- boot ---------- */
function boot() {
  $('#logoSvg').innerHTML = LOGO;
  $('#menuBtn').innerHTML = ic('menu'); $('#searchBtn').innerHTML = ic('search'); $('#fab').innerHTML = ic('add');
  document.querySelectorAll('#nav button').forEach(b => { const [i, l] = NAV[b.dataset.v]; b.innerHTML = ic(i) + l; b.onclick = () => go(b.dataset.v); });
  $('#menuBtn').onclick = () => drawer(true);
  $('#scrim').onclick = () => drawer(false);
  $('#searchBtn').onclick = openSearch;
  $('#title').onclick = () => { if (view === 'home' || view === 'insight') openBudgets(); };
  $('#fab').onclick = () => choose('Add', [
    {label: 'Expense', icon: 'exp', fn: () => txForm({type: 'expense'})},
    {label: 'Income', icon: 'inc', fn: () => txForm({type: 'income'})},
    {label: 'Transfer', icon: 'swap', fn: () => txForm({type: 'transfer'})}
  ]);
  load(); runRecurring(); render();
  setTimeout(() => { $('#splash').style.opacity = 0; setTimeout(() => $('#splash').remove(), 400); }, 900);
}
window.txForm = txForm;
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) { runRecurring(); refresh(); } });
boot();
</script>
