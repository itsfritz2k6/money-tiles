<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>iSaveMoney</title>
<style>
@font-face{font-family:Nunito;src:url(nunito.woff2) format('woff2');font-weight:400 800;font-display:swap}
:root{
  --rg:#B76E79; --rg2:#D9A59A; --rg3:#F3D9D2; --blush:#FBEDEA; --bg:#FFF8F6; --gold:#E2B27A;
  --ink:#4A3036; --mut:#9B7F84; --line:#F1DEDA; --green:#2E9D5B; --red:#D9434E;
  --grad:linear-gradient(135deg,#EDC2B4 0%,#DDA69A 45%,#C08085 80%,#B76E79 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:15px;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.ic{width:24px;height:24px;fill:currentColor;flex:none}
.green{color:var(--green)} .red{color:var(--red)} .mut{color:var(--mut)} .rg{color:var(--rg)}
.hidden{display:none!important}

/* splash */
#splash{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .35s}
#splash .logo{width:112px;height:112px;border-radius:34px;background:#FBE3DF;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(183,110,121,.25)}
#splash .name{position:absolute;bottom:46px;font-size:22px;font-weight:800;color:var(--rg)}

/* header */
.hero{background:var(--grad);color:#fff;padding:14px 12px 58px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;top:-40px;right:-30px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,0) 70%)}
.hrow{display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.hrow h1{flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.ib{width:42px;height:42px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ib:active{background:rgba(255,255,255,.25)}
.month{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:10px;position:relative;z-index:1}
.month b{min-width:150px;text-align:center;font-size:17px;font-weight:800}
.month .ib{width:38px;height:38px;background:rgba(255,255,255,.18)}

/* totals */
.totals{margin:-44px 12px 0;position:relative;z-index:2;background:#fff;border-radius:22px;padding:14px 10px 12px;box-shadow:0 8px 24px rgba(183,110,121,.18);border:1px solid var(--line)}
.totals h3{margin:0 6px 10px;font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tg{background:var(--blush);border-radius:14px;padding:10px 6px;text-align:center;min-width:0}
.tg small{display:block;font-size:12px;font-weight:700;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg b{display:block;font-size:16px;font-weight:800;margin-top:3px;white-space:nowrap}
.tg i{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:1px}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 12px 40px}
.tile{position:relative;background:linear-gradient(165deg,#FFFFFF 0%,#FCEDEA 100%);border:1px solid var(--line);border-radius:24px;padding:14px;min-height:168px;text-align:left;display:flex;flex-direction:column;box-shadow:0 6px 16px rgba(183,110,121,.10);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ti{width:60px;height:60px;border-radius:19px;background:#FBE3DF;display:flex;align-items:center;justify-content:center}
.tile .tn{font-weight:800;font-size:16px;margin-top:10px}
.tile .tt{font-weight:800;font-size:21px;margin-top:auto;padding-top:6px}
.tile .ts{font-size:12.5px;color:var(--mut);font-weight:600}
.tile .pb{margin-top:6px}
.tile.add{border:2px dashed var(--rg2);background:transparent;box-shadow:none;align-items:center;justify-content:center;color:var(--rg);font-weight:800;gap:8px}
.tile.add .plus{width:52px;height:52px;border-radius:50%;background:var(--blush);display:flex;align-items:center;justify-content:center}
.pb{height:7px;border-radius:4px;background:var(--rg3);overflow:hidden}
.pb i{display:block;height:100%;border-radius:4px;background:var(--green)}

/* sheets */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .24s ease}
.sheet.in{transform:none}
.sh{flex:none;background:var(--grad);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 6px;min-height:58px}
.sh h2{flex:1;margin:0;font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh h2 .mini{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;flex:none}
.sb{flex:1;overflow-y:auto;padding-bottom:110px}
.pop{position:fixed;inset:0;background:rgba(74,48,54,.35);z-index:40;display:flex;align-items:flex-end;opacity:0;transition:opacity .18s}
.pop.in{opacity:1}
.pc{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:10px 0 20px;max-height:86%;overflow:auto;transform:translateY(30px);transition:transform .18s}
.pop.in .pc{transform:none}
.pop.dlg{align-items:center;justify-content:center;padding:24px}
.pop.dlg .pc{border-radius:22px;padding:20px 20px 10px;max-width:360px}
.pc h3{margin:6px 18px 10px;font-size:17px;font-weight:800}
.pop.dlg .pc h3{margin:0 0 8px}
.pc p{margin:0 0 14px;line-height:1.5;color:#6d555a;font-size:14.5px}
.dlgb{display:flex;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.dlgb button{padding:10px 14px;color:var(--rg);font-weight:800;border-radius:10px}
.dlgb button.danger{color:var(--red)}
.opt{display:flex;align-items:center;gap:14px;padding:14px 20px;font-size:16px;width:100%;text-align:left;font-weight:600}
.opt:active{background:var(--blush)}
.opt.danger{color:var(--red)}

/* tile page */
.big{margin:14px 12px 0;background:#fff;border-radius:22px;padding:16px;border:1px solid var(--line);box-shadow:0 6px 18px rgba(183,110,121,.10);text-align:center}
.big small{font-size:13px;font-weight:700;color:var(--mut)}
.big b{display:block;font-size:32px;font-weight:800;margin:2px 0}
.big .split{display:flex;justify-content:space-around;margin-top:8px;font-size:13.5px;font-weight:700}
.big .split span{display:flex;flex-direction:column}
.big .split em{font-style:normal;font-size:17px;font-weight:800}
.big .pb{margin-top:10px;height:9px}
.mbar{display:flex;align-items:center;justify-content:center;gap:4px;margin:12px 0 0;color:var(--rg)}
.mbar b{min-width:140px;text-align:center;font-weight:800;font-size:16px}
.mbar .ib{background:var(--blush)}
.seg{display:flex;background:var(--blush);border-radius:14px;padding:4px;margin:12px 12px 0}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:800;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px}
.seg button .ic{width:19px;height:19px}
.seg button.on{background:#fff;color:var(--rg);box-shadow:0 2px 6px rgba(183,110,121,.15)}
.list{margin:12px 12px 0;background:#fff;border-radius:20px;border:1px solid var(--line);overflow:hidden}
.dsep{padding:9px 16px 5px;font-size:12.5px;font-weight:800;color:var(--mut);background:#FFFBFA;border-top:1px solid var(--line)}
.dsep:first-child{border-top:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:62px;transition:background .15s}
.dsep + .row,.list > .row:first-child{border-top:0}
.row:active{background:var(--blush)}
.bub{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:20px}
.bub.in{background:#E3F4E9;color:var(--green)} .bub.out{background:#FBE3E5;color:var(--red)}
.mid{flex:1;min-width:0}
.nm{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--mut);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:3px;background:var(--blush);color:var(--rg);border-radius:8px;padding:1px 7px;font-weight:700;font-size:11.5px}
.tag .ic{width:12px;height:12px}
.amt{font-weight:800;font-size:16px;white-space:nowrap}
.ck{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--rg2);display:flex;align-items:center;justify-content:center;flex:none;color:transparent;transition:all .18s}
.ck .ic{width:20px;height:20px}
.ck.on{background:var(--green);border-color:var(--green);color:#fff;animation:popk .25s}
@keyframes popk{50%{transform:scale(1.2)}}
.row.done .nm,.row.done .amt{text-decoration:line-through;text-decoration-thickness:2px;opacity:.45}
.row.done .sub{opacity:.6}
.empty{padding:30px 22px;text-align:center;color:var(--mut);font-size:14.5px;line-height:1.5;font-weight:600}
.empty .ei{width:84px;height:84px;margin:0 auto 10px;opacity:.9}
.fab{position:fixed;right:18px;bottom:22px;width:62px;height:62px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(183,110,121,.45);z-index:31}
.fab .ic{width:32px;height:32px}
.fab:active{transform:scale(.94)}

/* calendar */
.cal{margin:12px 12px 0;background:#fff;border-radius:20px;border:1px solid var(--line);padding:10px 8px}
.cal .wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;font-weight:800;color:var(--mut);padding-bottom:6px}
.cal .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .d{min-height:50px;border-radius:12px;padding:4px 1px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:14px}
.cal .d.o{visibility:hidden}
.cal .d.has{background:var(--blush)}
.cal .d .n{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.cal .d.today .n{background:var(--rg);color:#fff;border-radius:50%}
.cal .d.sel{outline:2.5px solid var(--rg);outline-offset:-2px}
.cal .d small{font-size:9.5px;font-weight:800;line-height:1.1;max-width:100%;overflow:hidden}
.cal .dots{display:flex;gap:2px}
.cal .dots i{width:6px;height:6px;border-radius:50%;background:var(--rg2)}
.cal .dots i.ok{background:var(--green)}
.dayh{display:flex;align-items:center;justify-content:space-between;margin:14px 16px 0;font-weight:800}
.dayh button{color:var(--rg);font-weight:800;display:flex;align-items:center;gap:4px}
.dayh button .ic{width:18px;height:18px}

/* forms */
.form{padding:6px 16px}
.amtbox{display:flex;align-items:center;justify-content:center;gap:4px;margin:16px 0 6px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px}
.amtbox .sg{font-size:34px;font-weight:800}
.amtbox input{width:100%;max-width:230px;border:0;outline:none;font-size:38px;font-weight:800;background:transparent;text-align:left}
.fld{margin:14px 0}
.fld > label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);background:#fff;padding:12px 14px;font-size:16px;outline:none;border-radius:14px;font-weight:600}
.fld input:focus,.fld select:focus{border-color:var(--rg2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 14px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:14px;color:#7a5f64}
.chips button.on{background:var(--rg);border-color:var(--rg);color:#fff}
.inl{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:700}
.inl input{max-width:110px}
.summary{margin-top:10px;background:var(--blush);color:var(--rg);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700;line-height:1.4}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:18px;background:var(--grad);color:#fff;font-weight:800;font-size:16px;margin-top:16px;box-shadow:0 6px 14px rgba(183,110,121,.3)}
.btn.soft{background:var(--blush);color:var(--rg);box-shadow:none}
.btn.ghost{background:transparent;color:var(--red);border:1.5px solid #F2C3C6;box-shadow:none}
.hint{font-size:13px;color:var(--mut);margin-top:6px;line-height:1.45;font-weight:600}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.icons button{aspect-ratio:1;border-radius:18px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.icons button.on{border-color:var(--rg);background:var(--blush)}
.icons svg{width:44px;height:44px}
.kinds{display:grid;gap:8px}
.kinds button{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;text-align:left;font-weight:600;font-size:14px;color:var(--mut)}
.kinds button b{display:block;color:var(--ink);font-size:15.5px}
.kinds button.on{border-color:var(--rg);background:var(--blush)}
.kinds .sw{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;font-weight:700;z-index:60;opacity:0;transition:opacity .2s;max-width:86%;text-align:center;pointer-events:none}
.toast.on{opacity:1}
.setrow{display:flex;align-items:center;gap:14px;padding:15px 16px;border-top:1px solid var(--line);font-weight:700;width:100%;text-align:left}
.setrow:first-child{border-top:0}
.setrow .ic{color:var(--rg)}
</style>
</head>
<body>

<div id="splash"><div class="logo" id="splashLogo"></div><div class="name">iSaveMoney</div></div>

<div class="hero">
  <div class="hrow">
    <h1 id="appTitle">iSaveMoney</h1>
    <button class="ib" id="setBtn" aria-label="Settings"></button>
  </div>
  <div class="month"><button class="ib" id="mPrev" aria-label="Previous month"></button><b id="mLbl"></b><button class="ib" id="mNext" aria-label="Next month"></button></div>
</div>
<section class="totals"><h3 id="totH"></h3><div class="tgrid" id="tgrid"></div></section>
<section class="tiles" id="tiles"></section>

const ic = (n, cls) => `<svg class="ic ${cls || ''}" viewBox="0 0 24 24"><path d="${P[n]}"/></svg>`;

/* ---------- cute icons ---------- */

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r2 = n => Math.round((+n || 0) * 100) / 100;
const sum = (a, f) => r2(a.reduce((t, x) => t + f(x), 0));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
const monthEnd = (y, m) => new Date(y, m + 1, 0).getDate();
function addMonths(s, n, day) {
  const d = pd(s), want = day || d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  t.setDate(Math.min(want, monthEnd(t.getFullYear(), t.getMonth())));
  return iso(t);
}
const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MO = MON.map(m => m.slice(0, 3));
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const nice = s => { const d = pd(s); return `${MO[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
const shortD = s => { const d = pd(s); return `${MO[d.getMonth()]} ${d.getDate()}`; };
const dayH = s => { const d = pd(s); return `${DOW[d.getDay()]}, ${MO[d.getMonth()]} ${d.getDate()}`; };
const ord = n => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
function fmt(n) { return S.currency + Math.abs(r2(n)).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
const MINUS = '−';
function signed(n, kind) { return kind === 'in' ? '+' + fmt(n) : kind === 'out' ? MINUS + fmt(n) : fmt(n); }
const kindClass = k => k === 'in' ? 'green' : k === 'out' ? 'red' : 'rg';
function money(v) {
  v = String(v || '').replace(/,/g, '').replace(/[^\d.]/g, '');
  const n = parseFloat(v); return isFinite(n) ? r2(n) : NaN;
}
function toast(msg) {
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ---------- state ---------- */
const KEY = 'isavemoney_tiles_v2';
let S;
function fresh() {
  return {
    v: 2, currency: '$',
    tiles: [
      {id: 'earn', name: 'Earnings', kind: 'in', icon: 'piggy'},
      {id: 'tx', name: 'Transactions', kind: 'out', icon: 'bag'},
      {id: 'budget', name: 'Budget', kind: 'check', icon: 'clip'}
    ],
    items: []
  };
}
function load() {
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
  if (!S || S.v !== 2 || !Array.isArray(S.tiles)) S = fresh();
  if (!Array.isArray(S.items)) S.items = [];
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save on this phone'); } }
const tileOf = id => S.tiles.find(t => t.id === id);

/* ---------- months & repeats ---------- */
let curM = today().slice(0, 7);
const mStart = m => m + '-01';
const mEnd = m => { const [y, mo] = m.split('-').map(Number); return `${m}-${pad(monthEnd(y, mo - 1))}`; };
const mLabel = m => { const [y, mo] = m.split('-').map(Number); return `${MON[mo - 1]} ${y}`; };
const mShift = (m, n) => addMonths(mStart(m), n, 1).slice(0, 7);
const FREQ = {week: 'Every week', '2week': 'Every 2 weeks', month: 'Every month', year: 'Every year'};
const FREQ_SHORT = {week: 'Weekly', '2week': 'Every 2 weeks', month: 'Monthly', year: 'Yearly'};
const repeats = it => !!(it.rep && it.rep.f);
// The nth date of a repeating item (n = 0 is its first date).
function nth(it, n) {
  const f = repeats(it) ? it.rep.f : '', day = pd(it.date).getDate();
  if (f === 'week') return addDays(it.date, 7 * n);
  if (f === '2week') return addDays(it.date, 14 * n);
  if (f === 'month') return addMonths(it.date, n, day);
  if (f === 'year') return addMonths(it.date, 12 * n, day);
  return it.date;
}
function lastDate(it) {
  if (!repeats(it)) return it.date;
  if (it.rep.end === 'count') return nth(it, Math.max(1, it.rep.count) - 1);
  if (it.rep.end === 'until') return it.rep.until;
  return null;
}
// Every date an item lands on between s and e, with its number in the series.
function occ(it, s, e) {
  const out = [], skip = it.skip || {};
  if (!repeats(it)) { if (it.date >= s && it.date <= e && !skip[it.date]) out.push({d: it.date, n: 1}); return out; }
  const r = it.rep;
  for (let n = 0; n < 5000; n++) {
    const d = nth(it, n);
    if (d > e) break;
    if (r.end === 'count' && n >= r.count) break;
    if (r.end === 'until' && r.until && d > r.until) break;
    if (d >= s && !skip[d]) out.push({d, n: n + 1});
  }
  return out;
}
function entries(tileId, s, e) {
  const out = [];
  for (const it of S.items) if (it.tile === tileId) for (const o of occ(it, s, e)) out.push({it, d: o.d, n: o.n, done: !!(it.done || {})[o.d]});
  return out.sort((a, b) => a.d.localeCompare(b.d) || (a.it.name || '').localeCompare(b.it.name || ''));
}
function tileTotals(t, m) {
  const list = entries(t.id, mStart(m), mEnd(m));
  const total = sum(list, x => x.it.amt);
  const paid = sum(list.filter(x => x.done), x => x.it.amt);
  return {list, total, paid, left: r2(total - paid), count: list.length, doneCount: list.filter(x => x.done).length};
}
function repText(it, n) {
  if (!repeats(it)) return '';
  const r = it.rep;
  let s = FREQ_SHORT[r.f];
  if (r.end === 'count') s += n ? ` · ${n} of ${r.count}` : ` · ${r.count} times`;
  else if (r.end === 'until') s += ` · until ${shortD(r.until)}`;
  return s;
}

/* ---------- sheets / dialogs ---------- */
const stack = [];
function sheet(title, body, o = {}) {
  const el = document.createElement('div'); el.className = 'sheet';
  el.innerHTML = `<div class="sh"><button class="ib" data-x>${ic('back')}</button><h2>${o.icon ? `<span class="mini">${cute(o.icon, 26)}</span>` : ''}<span>${esc(title)}</span></h2>${o.head || ''}</div><div class="sb">${body}</div>${o.fab ? `<button class="fab" data-fab aria-label="Add">${ic('add')}</button>` : ''}`;
  document.body.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  stack.push({el, onClose: o.onClose});
  el.querySelector('[data-x]').onclick = () => closeTop();
  if (o.fab) el.querySelector('[data-fab]').onclick = o.fab;
  if (o.mount) o.mount(el);
  return el;
}
function pop(html, o = {}) {
  const el = document.createElement('div'); el.className = 'pop' + (o.dlg ? ' dlg' : '');
  el.innerHTML = `<div class="pc">${html}</div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('in'));
  stack.push({el, onClose: o.onClose});
  el.addEventListener('click', e => { if (e.target === el) closeTop(); });
  return el;
}
function closeTop() {
  const r = stack.pop(); if (!r) return;
  r.el.classList.remove('in'); setTimeout(() => r.el.remove(), 240);
  if (r.onClose) r.onClose();
}
function closeAll() { while (stack.length) closeTop(); }
function ask(title, msg, ok, danger) {
  return new Promise(res => {
    let done = false;
    const el = pop(`<h3>${esc(title)}</h3><p>${msg}</p><div class="dlgb"><button data-n>Cancel</button><button data-y class="${danger ? 'danger' : ''}">${esc(ok || 'OK')}</button></div>`, {dlg: true, onClose: () => { if (!done) res(false); }});
    el.querySelector('[data-n]').onclick = () => closeTop();
    el.querySelector('[data-y]').onclick = () => { done = true; closeTop(); res(true); };
  });
}
function choose(title, opts, msg) {
  return new Promise(res => {
    let done = false;
    const el = pop(`<h3>${esc(title)}</h3>${msg ? `<p style="margin:0 18px 8px">${msg}</p>` : ''}` + opts.map((o, i) => `<button class="opt ${o.danger ? 'danger' : ''}" data-i="${i}">${o.icon ? ic(o.icon) : ''}<span>${esc(o.label)}</span></button>`).join(''), {onClose: () => { if (!done) res(null); }});
    el.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { done = true; closeTop(); res(opts[+b.dataset.i].v); });
  });
}
window.appBack = function () { if (stack.length) { closeTop(); return true; } return false; };
function refresh() { renderHome(); for (const s of stack) if (s.el._draw) s.el._draw(); }

/* ---------- HOME ---------- */
function renderHome() {
  $('#mLbl').textContent = mLabel(curM);
  $('#totH').textContent = `${MON[+curM.slice(5) - 1]} totals`;
  const tt = S.tiles.map(t => ({t, x: tileTotals(t, curM)}));
  $('#tgrid').innerHTML = tt.map(({t, x}) => `<div class="tg"><small>${esc(t.name)}</small><b class="${kindClass(t.kind)}">${signed(x.total, t.kind)}</b>${t.kind === 'check' ? `<i>${fmt(x.paid)} paid</i>` : `<i>${x.count} ${x.count === 1 ? 'entry' : 'entries'}</i>`}</div>`).join('');
  $('#tiles').innerHTML = tt.map(({t, x}) => `<button class="tile" data-t="${t.id}"><div class="ti">${cute(t.icon, 46)}</div><div class="tn">${esc(t.name)}</div>
      <div class="tt ${kindClass(t.kind)}">${signed(x.total, t.kind)}</div>
      ${t.kind === 'check' ? `<div class="ts">${x.doneCount} of ${x.count} paid</div><div class="pb"><i style="width:${x.total > 0 ? x.paid / x.total * 100 : 0}%"></i></div>` : `<div class="ts">${x.count} ${x.count === 1 ? 'entry' : 'entries'} this month</div>`}
    </button>`).join('') + `<button class="tile add" id="addTile"><span class="plus">${ic('add')}</span>Add a tile</button>`;
  document.querySelectorAll('#tiles [data-t]').forEach(b => b.onclick = () => openTile(b.dataset.t));
  $('#addTile').onclick = () => tileForm();
}

/* ---------- TILE PAGE ---------- */
function openTile(id) {
  let mode = 'list', selDay = null;
  const t = tileOf(id);
  const el = sheet(t.name, '', {icon: t.icon, head: `<button class="ib" data-more aria-label="Edit tile">${ic('more')}</button>`, fab: () => itemForm({tile: id, date: selDay || defDate()})});
  el.querySelector('[data-more]').onclick = () => tileForm(tileOf(id));
  const draw = () => {
    const T = tileOf(id); if (!T) return;
    el.querySelector('h2').innerHTML = `<span class="mini">${cute(T.icon, 26)}</span><span>${esc(T.name)}</span>`;
    const x = tileTotals(T, curM);
    let h = `<div class="mbar"><button class="ib" data-mp>${ic('left')}</button><b>${mLabel(curM)}</b><button class="ib" data-mn>${ic('right')}</button></div>`;
    if (T.kind === 'check') {
      h += `<div class="big"><small>Total ${esc(T.name.toLowerCase())}</small><b class="rg">${fmt(x.total)}</b>
        <div class="pb"><i style="width:${x.total > 0 ? x.paid / x.total * 100 : 0}%"></i></div>
        <div class="split"><span><em class="green">${fmt(x.paid)}</em>Paid · ${x.doneCount}</span><span><em class="red">${fmt(x.left)}</em>Left to pay · ${x.count - x.doneCount}</span></div></div>`;
    } else {
      h += `<div class="big"><small>Total ${esc(T.name.toLowerCase())}</small><b class="${kindClass(T.kind)}">${signed(x.total, T.kind)}</b><small>${x.count} ${x.count === 1 ? 'entry' : 'entries'} in ${MON[+curM.slice(5) - 1]}</small></div>`;
    }
    h += `<div class="seg"><button data-mode="list" class="${mode === 'list' ? 'on' : ''}">${ic('list')}${T.kind === 'check' ? 'Checklist' : 'List'}</button><button data-mode="cal" class="${mode === 'cal' ? 'on' : ''}">${ic('cal')}Calendar</button></div>`;
    if (mode === 'cal') {
      h += calendar(T, x.list, selDay);
      if (selDay) {
        const dl = x.list.filter(e => e.d === selDay);
        h += `<div class="dayh"><span>${dayH(selDay)}</span><button data-addday>${ic('add')}Add on this day</button></div>`;
        h += dl.length ? `<div class="list">${dl.map(e => row(T, e)).join('')}</div>` : `<div class="empty" style="padding:16px">Nothing on this day.</div>`;
      } else h += `<div class="hint" style="text-align:center;margin-top:10px">Tap a day to see or add entries.</div>`;
    } else {
      h += x.list.length ? `<div class="list">${groupRows(T, x.list)}</div>` : emptyState(T);
    }
    el.querySelector('.sb').innerHTML = h;
    const q = s => el.querySelector(s);
    q('[data-mp]').onclick = () => { curM = mShift(curM, -1); selDay = null; refresh(); };
    q('[data-mn]').onclick = () => { curM = mShift(curM, 1); selDay = null; refresh(); };
    el.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; draw(); });
    el.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { selDay = b.dataset.day; draw(); });
    if (q('[data-addday]')) q('[data-addday]').onclick = () => itemForm({tile: id, date: selDay});
    wireRows(el);
  };
  el._draw = draw; draw();
  return el;
}
function defDate() { const t = today(); return t.slice(0, 7) === curM ? t : mStart(curM); }
function emptyState(T) {
  const what = T.kind === 'in' ? 'earning' : T.kind === 'out' ? 'transaction' : 'bill to pay';
  return `<div class="empty"><div class="ei">${cute(T.icon, 84)}</div>Nothing in ${esc(T.name)} for ${MON[+curM.slice(5) - 1]} yet.<br>Tap <b>+</b> to add your first ${what}.</div>`;
}
function groupRows(T, list) {
  let h = '', last = '';
  for (const e of list) { if (e.d !== last) { h += `<div class="dsep">${dayH(e.d)}</div>`; last = e.d; } h += row(T, e); }
  return h;
}
function row(T, e) {
  const it = e.it, rt = repText(it, it.rep && it.rep.end === 'count' ? e.n : 0);
  const lead = T.kind === 'check'
    ? `<button class="ck ${e.done ? 'on' : ''}" data-ck="${it.id}" data-d="${e.d}" aria-label="Mark paid">${ic('check')}</button>`
    : `<div class="bub ${T.kind}">${T.kind === 'in' ? '+' : MINUS}</div>`;
  return `<div class="row ${e.done ? 'done' : ''}" data-it="${it.id}" data-d="${e.d}">${lead}<div class="mid"><div class="nm">${esc(it.name || T.name)}</div><div class="sub">${T.kind === 'check' ? `<span>Due ${shortD(e.d)}</span>` : ''}${rt ? `<span class="tag">${ic('repeat')}${rt}</span>` : ''}${it.note ? `<span>${esc(it.note)}</span>` : ''}</div></div><div class="amt ${kindClass(T.kind)}">${signed(it.amt, T.kind)}</div></div>`;
}
function wireRows(el) {
  el.querySelectorAll('[data-ck]').forEach(b => b.onclick = ev => {
    ev.stopPropagation();
    const it = S.items.find(i => i.id === b.dataset.ck); if (!it) return;
    it.done = it.done || {};
    if (it.done[b.dataset.d]) delete it.done[b.dataset.d]; else it.done[b.dataset.d] = true;
    save(); refresh();
  });
  el.querySelectorAll('[data-it]').forEach(r => r.onclick = () => { const it = S.items.find(i => i.id === r.dataset.it); if (it) itemForm(it, r.dataset.d); });
}
function calendar(T, list, selDay) {
  const [y, m] = curM.split('-').map(Number);
  const first = new Date(y, m - 1, 1).getDay(), n = monthEnd(y, m - 1), t = today();
  const by = {}; for (const e of list) (by[e.d] = by[e.d] || []).push(e);
  let g = '';
  for (let i = 0; i < first; i++) g += `<div class="d o"></div>`;
  for (let d = 1; d <= n; d++) {
    const ds = `${curM}-${pad(d)}`, es = by[ds] || [];
    let extra = '';
    if (es.length) {
      if (T.kind === 'check') extra = `<span class="dots">${es.slice(0, 4).map(e => `<i class="${e.done ? 'ok' : ''}"></i>`).join('')}</span>`;
      else { const v = sum(es, e => e.it.amt); extra = `<small class="${kindClass(T.kind)}">${T.kind === 'in' ? '+' : MINUS}${compact(v)}</small>`; }
    }
    g += `<button class="d ${es.length ? 'has' : ''} ${ds === t ? 'today' : ''} ${ds === selDay ? 'sel' : ''}" data-day="${ds}"><span class="n">${d}</span>${extra}</button>`;
  }
  return `<div class="cal"><div class="wk">${DOW.map(d => `<span>${d[0]}</span>`).join('')}</div><div class="gr">${g}</div></div>`;
}
function compact(v) { return v >= 10000 ? Math.round(v / 1000) + 'k' : v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : Math.round(v); }

/* ---------- ITEM FORM ---------- */
function itemForm(it0, occDate) {
  const isNew = !it0.id;
  const T = tileOf(it0.tile);
  const it = Object.assign({name: '', amt: '', date: defDate(), note: '', rep: T.kind === 'check' && isNew ? {f: 'month', end: 'never'} : null}, JSON.parse(JSON.stringify(it0)));
  const rep = Object.assign({f: '', end: 'never', count: 12, until: ''}, it.rep || {});
  const noun = T.kind === 'in' ? 'earning' : T.kind === 'out' ? 'transaction' : 'bill';
  const ph = T.kind === 'in' ? 'e.g. Paycheck' : T.kind === 'out' ? 'e.g. Groceries' : 'e.g. Rent';
  const names = [...new Set(S.items.filter(i => i.tile === T.id && i.name).map(i => i.name))].slice(0, 40);
  const body = `<div class="form">
    <div class="amtbox"><span class="sg ${kindClass(T.kind)}">${T.kind === 'in' ? '+' : T.kind === 'out' ? MINUS : ''}${esc(S.currency)}</span><input id="fAmt" class="${kindClass(T.kind)}" inputmode="decimal" placeholder="0.00" value="${it.amt === '' ? '' : r2(it.amt).toFixed(2)}" autocomplete="off"></div>
    <div class="fld"><label>${T.kind === 'check' ? 'What do you pay?' : 'What is it?'}</label><input id="fName" list="fNames" value="${esc(it.name)}" placeholder="${ph}" autocomplete="off"><datalist id="fNames">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist></div>
    <div class="fld"><label>${T.kind === 'check' ? 'Due date' : 'Date'}${!isNew && repeats(it) ? ' (first one)' : ''}</label><input type="date" id="fDate" value="${it.date}"></div>
    <div class="fld"><label>Does it repeat?</label><div class="chips" id="fRep"><button data-f="">No, just once</button>${Object.keys(FREQ).map(k => `<button data-f="${k}">${FREQ[k]}</button>`).join('')}</div></div>
    <div class="fld" id="fLongW"><label>For how long?</label><div class="chips" id="fLong"><button data-e="never">Forever</button><button data-e="count">A number of times</button><button data-e="until">Until a date</button></div>
      <div class="inl" id="fCountW"><input id="fCount" type="number" inputmode="numeric" min="1" max="999" value="${rep.count || 12}"><span>times in total</span></div>
      <div class="inl" id="fUntilW"><span>Last one on or before</span><input type="date" id="fUntil" value="${rep.until || ''}" style="max-width:none;flex:1"></div>
      <div class="summary" id="fSum"></div></div>
    <div class="fld"><label>Note (optional)</label><input id="fNote" value="${esc(it.note)}" placeholder="Anything to remember"></div>
    <button class="btn" id="fSave">${ic('check')}${isNew ? 'Save ' + noun : 'Save changes'}</button>
    ${!isNew ? `<button class="btn ghost" id="fDel">${ic('del')}Delete</button>` : ''}
    ${!isNew && repeats(it) ? `<div class="hint">Changes here apply to every time this ${noun} repeats.</div>` : ''}
  </div>`;
  return sheet(isNew ? `New ${noun}` : `Edit ${noun}`, body, {icon: T.icon, mount: el => {
    const q = s => el.querySelector(s);
    const sync = () => {
      q('#fRep').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.f === rep.f));
      q('#fLong').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.e === rep.end));
      q('#fLongW').classList.toggle('hidden', !rep.f);
      q('#fCountW').classList.toggle('hidden', rep.end !== 'count');
      q('#fUntilW').classList.toggle('hidden', rep.end !== 'until');
      if (rep.f) {
        const date = q('#fDate').value || today(), d = pd(date);
        const tmp = {date, rep: {f: rep.f, end: rep.end, count: Math.max(1, parseInt(q('#fCount').value) || 1), until: q('#fUntil').value}};
        const on = rep.f === 'month' ? `on the ${ord(d.getDate())}` : rep.f === 'year' ? `on ${MO[d.getMonth()]} ${d.getDate()}` : `on ${DOW[d.getDay()]}s`;
        let s = `${FREQ[rep.f]} ${on}, starting ${nice(date)}`;
        if (rep.end === 'count') s += `. ${tmp.rep.count} time${tmp.rep.count > 1 ? 's' : ''}, last one ${nice(lastDate(tmp))}.`;
        else if (rep.end === 'until') s += tmp.rep.until ? `, until ${nice(tmp.rep.until)}.` : '. Pick the last date.';
        else s += ', with no end date.';
        q('#fSum').textContent = s;
      }
    };
    q('#fRep').onclick = e => { const b = e.target.closest('button'); if (b) { rep.f = b.dataset.f; sync(); } };
    q('#fLong').onclick = e => { const b = e.target.closest('button'); if (b) { rep.end = b.dataset.e; if (rep.end === 'until' && !q('#fUntil').value) q('#fUntil').value = addMonths(q('#fDate').value || today(), 6); sync(); } };
    el.addEventListener('input', sync); el.addEventListener('change', sync);
    sync();
    if (isNew) setTimeout(() => q('#fAmt').focus(), 300);
    q('#fSave').onclick = () => {
      const amt = money(q('#fAmt').value);
      if (!(amt > 0)) { toast('Type in an amount'); q('#fAmt').focus(); return; }
      const date = q('#fDate').value; if (!date) { toast('Pick a date'); return; }
      let r = null;
      if (rep.f) {
        r = {f: rep.f, end: rep.end};
        if (rep.end === 'count') r.count = Math.max(1, Math.min(999, parseInt(q('#fCount').value) || 1));
        if (rep.end === 'until') { r.until = q('#fUntil').value; if (!r.until || r.until < date) { toast('The last date has to be after the first'); return; } }
      }
      const rec = {id: it.id || uid(), tile: T.id, name: q('#fName').value.trim(), amt, date, rep: r, note: q('#fNote').value.trim(), done: it.done || {}, skip: it.skip || {}};
      const i = S.items.findIndex(x => x.id === rec.id);
      if (i >= 0) S.items[i] = rec; else S.items.push(rec);
      save(); closeTop();
      // a one-off saved into another month: jump there so she sees it
      if (isNew && !r && date.slice(0, 7) !== curM) curM = date.slice(0, 7);
      refresh(); toast(isNew ? 'Saved' : 'Changes saved');
    };
    if (q('#fDel')) q('#fDel').onclick = async () => {
      const cur = S.items.find(x => x.id === it.id); if (!cur) return;
      let how = 'all';
      if (repeats(cur) && occDate) {
        how = await choose('Delete which?', [
          {label: `Only this one (${shortD(occDate)})`, v: 'one', icon: 'cal'},
          {label: 'This one and every one after', v: 'after', icon: 'right'},
          {label: 'Every one, past and future', v: 'all', icon: 'del', danger: true}
        ], `"${esc(cur.name || T.name)}" repeats ${FREQ[cur.rep.f].toLowerCase()}.`);
        if (!how) return;
      } else if (!await ask('Delete this?', `${esc(cur.name || T.name)} · ${fmt(cur.amt)}`, 'Delete', true)) return;
      if (how === 'one') { cur.skip = cur.skip || {}; cur.skip[occDate] = true; }
      else if (how === 'after' && occDate > cur.date) { cur.rep.end = 'until'; cur.rep.until = addDays(occDate, -1); delete cur.rep.count; }
      else S.items = S.items.filter(x => x.id !== cur.id);
      save(); closeTop(); refresh(); toast('Deleted');
    };
  }});
}

/* ---------- TILE FORM (add / edit tiles) ---------- */
const KINDS = [
  {k: 'in', t: 'Money coming in', d: 'Like Earnings. Shows in green with a +.', sw: '+', c: '#E3F4E9', fc: 'var(--green)'},
  {k: 'out', t: 'Money going out', d: 'Like Transactions. Shows in red with a −.', sw: MINUS, c: '#FBE3E5', fc: 'var(--red)'},
  {k: 'check', t: 'Checklist to pay', d: 'Like Budget. Tick things off as you pay them.', sw: '✓', c: '#FBE3DF', fc: 'var(--rg)'}
];
function tileForm(t) {
  const isNew = !t;
  let kind = t ? t.kind : 'out', icon = t ? t.icon : 'heart';
  const idx = t ? S.tiles.indexOf(t) : -1;
  const n = t ? S.items.filter(i => i.tile === t.id).length : 0;
  return sheet(isNew ? 'New tile' : 'Edit tile', `<div class="form">
    <div class="fld"><label>Tile name</label><input id="tName" value="${esc(t ? t.name : '')}" placeholder="e.g. Savings, Kids, Pets"></div>
    <div class="fld"><label>What kind of tile?</label><div class="kinds" id="tKind">${KINDS.map(o => `<button data-k="${o.k}"><span class="sw" style="background:${o.c};color:${o.fc}">${o.sw}</span><span><b>${o.t}</b>${o.d}</span></button>`).join('')}</div></div>
    <div class="fld"><label>Pick an icon</label><div class="icons" id="tIcons">${Object.keys(CUTE).map(k => `<button data-i="${k}">${cute(k)}</button>`).join('')}</div></div>
    <button class="btn" id="tSave">${ic('check')}${isNew ? 'Add tile' : 'Save'}</button>
    ${!isNew ? `<div style="display:flex;gap:8px"><button class="btn soft" id="tUp" ${idx === 0 ? 'disabled style="opacity:.4"' : ''}>${ic('left')}Move earlier</button><button class="btn soft" id="tDown" ${idx === S.tiles.length - 1 ? 'disabled style="opacity:.4"' : ''}>Move later${ic('right')}</button></div>
    <button class="btn ghost" id="tDel">${ic('del')}Delete tile</button>` : ''}
  </div>`, {mount: el => {
    const q = s => el.querySelector(s);
    const sync = () => {
      q('#tKind').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === kind));
      q('#tIcons').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.i === icon));
    };
    q('#tKind').onclick = e => { const b = e.target.closest('button'); if (b) { kind = b.dataset.k; sync(); } };
    q('#tIcons').onclick = e => { const b = e.target.closest('button'); if (b) { icon = b.dataset.i; sync(); } };
    sync();
    q('#tSave').onclick = () => {
      const name = q('#tName').value.trim(); if (!name) { toast('Give the tile a name'); q('#tName').focus(); return; }
      if (isNew) S.tiles.push({id: uid(), name, kind, icon});
      else Object.assign(t, {name, kind, icon});
      save(); closeTop(); refresh(); toast(isNew ? 'Tile added' : 'Saved');
    };
    if (!isNew) {
      const move = d => { const i = S.tiles.indexOf(t), j = i + d; if (j < 0 || j >= S.tiles.length) return; S.tiles.splice(i, 1); S.tiles.splice(j, 0, t); save(); closeTop(); refresh(); toast('Moved'); };
      q('#tUp').onclick = () => move(-1); q('#tDown').onclick = () => move(1);
      q('#tDel').onclick = async () => {
        if (!await ask(`Delete ${esc(t.name)}?`, n ? `The tile and its ${n} entr${n === 1 ? 'y' : 'ies'} will be deleted. This can't be undone.` : 'This tile will be removed.', 'Delete', true)) return;
        S.items = S.items.filter(i => i.tile !== t.id); S.tiles = S.tiles.filter(x => x.id !== t.id);
        save(); closeAll(); refresh(); toast('Tile deleted');
      };
    }
  }});
}

/* ---------- SETTINGS / DATA ---------- */
function saveFile(name, text, mime) {
  if (window.Native && Native.save) { Native.save(name, text, mime); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type: mime})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Saved ' + name);
}
const stamp = () => { const d = new Date(); return `${iso(d)}-${pad(d.getHours())}${pad(d.getMinutes())}`; };
function exportCSV() {
  const y = curM.slice(0, 4), q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const rows = [];
  for (const t of S.tiles) for (const e of entries(t.id, `${y}-01-01`, `${y}-12-31`))
    rows.push([e.d, t.name, e.it.name, (t.kind === 'out' ? -e.it.amt : e.it.amt).toFixed(2), repeats(e.it) ? FREQ[e.it.rep.f] : '', t.kind === 'check' ? (e.done ? 'yes' : 'no') : '', e.it.note]);
  rows.sort((a, b) => a[0].localeCompare(b[0]));
  rows.unshift(['Date', 'Tile', 'Name', 'Amount', 'Repeats', 'Paid', 'Note']);
  saveFile(`isavemoney-${y}.csv`, rows.map(r => r.map(q).join(',')).join('\n'), 'text/csv');
}
function restore() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json,text/plain,*/*';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = async () => {
      let d; try { d = JSON.parse(rd.result); } catch (e) { d = null; }
      if (!d || d.v !== 2 || !Array.isArray(d.tiles) || !Array.isArray(d.items)) { toast("That file isn't an iSaveMoney backup"); return; }
      if (!await ask('Restore this backup?', `${d.tiles.length} tiles and ${d.items.length} entries. Everything in the app now will be replaced.`, 'Restore', true)) return;
      S = d; save(); closeAll(); refresh(); toast('Backup restored');
    };
    rd.readAsText(f);
  };
  inp.click();
}
function openSettings() {
  const cur = ['$', '€', '£', '¥', '₹', '₱', '₦', 'R', 'R$', 'C$', 'A$'];
  return sheet('Settings', `<div class="form">
    <div class="fld"><label>Currency</label><div class="chips" id="sCur">${cur.map(c => `<button data-c="${esc(c)}" class="${S.currency === c ? 'on' : ''}">${esc(c)}</button>`).join('')}</div></div>
    <div class="list" style="margin:18px 0 0">
      <button class="setrow" id="sCsv">${ic('dl')}<span>Export this year to a spreadsheet (CSV)</span></button>
      <button class="setrow" id="sBak">${ic('backup')}<span>Back up my data</span></button>
      <button class="setrow" id="sRes">${ic('restore')}<span>Restore a backup</span></button>
    </div>
    <div class="hint" style="margin-top:12px">Everything is saved on this phone only. Back up before switching phones or uninstalling; the backup file goes to your Downloads folder.</div>
    <button class="btn ghost" id="sWipe" style="margin-top:28px">${ic('del')}Erase everything</button>
  </div>`, {icon: 'diamond', mount: el => {
    const q = s => el.querySelector(s);
    q('#sCur').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.currency = b.dataset.c; save(); q('#sCur').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); refresh(); };
    q('#sCsv').onclick = exportCSV;
    q('#sBak').onclick = () => saveFile(`isavemoney-backup-${stamp()}.json`, JSON.stringify(S), 'application/json');
    q('#sRes').onclick = restore;
    q('#sWipe').onclick = async () => { if (!await ask('Erase everything?', 'All tiles and entries will be deleted from this phone. This cannot be undone.', 'Erase', true)) return; S = fresh(); save(); closeAll(); refresh(); toast('Erased'); };
  }});
}

/* ---------- boot ---------- */
function boot() {
  $('#splashLogo').innerHTML = cute('piggy', 84);
  $('#appTitle').innerHTML = `iSaveMoney ${ic('sparkle')}`;
  $('#appTitle .ic').style.cssText = 'width:20px;height:20px;opacity:.9';
  $('#setBtn').innerHTML = ic('gear');
  $('#mPrev').innerHTML = ic('left'); $('#mNext').innerHTML = ic('right');
  $('#setBtn').onclick = openSettings;
  $('#mPrev').onclick = () => { curM = mShift(curM, -1); refresh(); };
  $('#mNext').onclick = () => { curM = mShift(curM, 1); refresh(); };
  $('#mLbl').onclick = () => { curM = today().slice(0, 7); refresh(); };
  load(); renderHome();
  setTimeout(() => { const s = $('#splash'); if (!s) return; s.style.opacity = 0; setTimeout(() => s.remove(), 400); }, 900);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) refresh(); });
boot();
</script>
</body>
</html>
